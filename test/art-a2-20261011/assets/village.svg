<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t d">
  <title id="t">마을 노을 풍경 (임시 오리지널 SVG)</title>
  <desc id="d">따뜻한 노을, 들꽃, 성당, 쉼터가 있는 마을. 임시 아트이며 최종 아트가 아닙니다.</desc>
  <defs>
