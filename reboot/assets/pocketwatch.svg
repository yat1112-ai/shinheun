      <stop offset="1" stop-color="#f0d9a6"/>
    </radialGradient>
    <linearGradient id="pw-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe08a"/>
      <stop offset="1" stop-color="#b9772c"/>
    </linearGradient>
  </defs>
  <g id="chain" fill="none" stroke="#b9772c" stroke-width="4">
