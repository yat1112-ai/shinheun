<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="t d">
  <title id="t">회중시계 모험 아이콘 (임시 오리지널 SVG)</title>
  <desc id="d">모험 아이콘이자 내비게이션 모티프인 나침반형 회중시계. 임시 아트이며 최종 아트가 아닙니다.</desc>
  <defs>
