<body><aside id="rotation-hint" role="note">가로로 돌리면 더 넓게 볼 수 있습니다. 세로 화면에서도 아래로 스크롤해 이용할 수 있습니다.</aside><main id="game" aria-label="신흔 1챕터"><header><div><small>신흔 · CHAPTER 01</small><h1>돌아가는 길</h1></div><div id="resources"></div><div id="cloud-controls"><span id="cloud-status" role="status" aria-live="polite"></span><button id="login" data-action="login">Google 로그인</button><button id="logout" data-action="logout" hidden>로그아웃</button><button id="retry" data-action="retry" hidden>재시도</button><button id="resolve" data-action="resolve" hidden>충돌 복구</button><button id="recover" data-action="backup" hidden>저장·백업</button></div><button data-action="save">저장</button></header><nav aria-label="마을 메뉴" id="nav"></nav><section id="content"></section><footer><span id="activity"></span><span>임시 아트 · 초안 밸런스</span></footer></main><div id="notice" role="status" aria-live="polite"></div><dialog id="story"><div id="story-content"></div><button id="story-next">다음</button></dialog><dialog id="backup"><h2>독립 저장 · JSON 백업</h2><p>백업은 완료 보상을 보존합니다. 진행 중인 전투는 복구 시 취소되며 반복은 재개를 제안합니다.</p><textarea id="backup-text" aria-label="JSON 백업 내용" spellcheck="false"></textarea><div class="actions"><button data-action="export">백업 생성</button><button data-action="saved-backup">보존한 원본 보기</button><button data-action="download">파일 다운로드</button><button data-action="import">입력 복구</button><button data-action="close-backup">닫기</button></div></dialog><dialog id="sync-dialog"><h2 id="sync-title"></h2><p id="sync-description"></p><div class="actions" id="sync-choices"></div><button data-action="backup">JSON 백업</button><button data-action="logout">로그아웃</button></dialog><script type="module" src="./app.js"></script></body>
