<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="only light">
<title>에이르 리그 뷰어</title>
<style>
:root{color-scheme:only light}
*{box-sizing:border-box}
body{margin:0;background:#0d0d12;color:#e8e6ee;font:14px/1.4 system-ui,'Noto Sans KR',sans-serif;-webkit-tap-highlight-color:transparent}
.wrap{max-width:460px;margin:0 auto;padding:10px 12px 24px}
h1{font-size:16px;margin:6px 0 8px;display:flex;justify-content:space-between;align-items:baseline}
h1 small{font-size:11px;color:#8c8aa0;font-weight:400}
.stage{position:relative;background:#16161e;border:1px solid #2a2a38;border-radius:10px;overflow:hidden;touch-action:none}
canvas{display:block;width:100%;height:auto}
.hud{display:flex;justify-content:space-between;font-size:12px;color:#9a98b0;padding:5px 2px}
.row{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
button,label.chk{font:inherit;color:#e8e6ee;background:#1e1e2a;border:1px solid #34344a;border-radius:7px;padding:8px 10px;min-height:38px}
button{flex:1 1 30%}
button.on{background:#3a1822;border-color:#d4344f;color:#fff}
label.chk{display:flex;align-items:center;gap:6px;flex:1 1 45%;font-size:13px}
.sec{font-size:12px;color:#8c8aa0;margin:12px 0 2px}
.parts{display:grid;grid-template-columns:repeat(2,1fr);gap:4px}
.parts label{font-size:12px;display:flex;gap:6px;align-items:center;padding:3px 4px;background:#14141c;border-radius:5px}
#msg{color:#e0a060;font-size:12px;min-height:16px}
</style>
</head>
<body>
<div class="wrap">
  <h1>에이르 리그 뷰어 <small>파츠 10장 · 시험용</small></h1>
  <div class="stage"><canvas id="cv" width="560" height="840"></canvas></div>
  <div class="hud"><span id="fps">FPS -</span><span id="an">idle</span><span id="sp">속도 ×1</span></div>
  <div id="msg"></div>
  <div class="row" id="anims"></div>
  <div class="row" id="speeds"></div>
  <div class="row">
    <label class="chk"><input type="checkbox" id="cmp"> 원본 비교(정지 합성)</label>
    <label class="chk"><input type="checkbox" id="piv"> 관절 점 표시</label>
    <label class="chk"><input type="checkbox" id="lt"> 밝은 배경</label>
    <label class="chk"><input type="checkbox" id="pre"> 지피티 미리보기 겹치기</label>
  </div>
  <div class="sec">파츠 표시</div>
  <div class="parts" id="parts"></div>
</div>
<script>
const CW=1024,CH=1536;
const MAN={body:{x:158,y:248,w:724,h:1159},arm_l:{x:590,y:290,w:247,h:574},arm_r:{x:292,y:289,w:274,h:434},head:{x:410,y:38,w:194,h:252},hair_back:{x:355,y:10,w:304,h:279},hair_front:{x:350,y:6,w:316,h:284},veil:{x:288,y:143,w:444,h:369},scarf:{x:552,y:552,w:274,h:739},legs:{x:437,y:1118,w:154,h:389},belt:{x:384,y:517,w:239,h:66}};
const BASE=location.pathname.includes('rig_viewer')?'../art/':'art/';
// 뒤→앞 합성 순서(검증됨) + 부모 + pivot(원본 캔버스 좌표)
const LAY=[
 {id:'hair_back', parent:'head',  pv:[507,285], lag:1.6, amp:2.4},
 {id:'veil',      parent:'head',  pv:[510,215], lag:1.2, amp:2.8},
 {id:'legs',      parent:'body',  pv:[515,1130], lag:0, amp:0},
 {id:'body',      parent:null,    pv:[515,1130]},
 {id:'belt',      parent:'body',  pv:[505,550]},
 {id:'scarf',     parent:'body',  pv:[600,560], lag:1.0, amp:3.2},
 {id:'arm_l',     parent:'body',  pv:[612,302], lag:0.5, amp:1.4},
 {id:'arm_r',     parent:'body',  pv:[548,302], lag:0.4, amp:1.4},
 {id:'head',      parent:'body',  pv:[507,285]},
 {id:'hair_front',parent:'head',  pv:[507,285], lag:1.0, amp:1.8},
];
const ANIMS=['idle','hit','attack','skill','down','hurt'];
const imgs={};let loaded=0,failed=[];
let anim='idle',speed=1,t0=performance.now(),tAnim=0;
const vis={};LAY.forEach(l=>vis[l.id]=true);
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const $=id=>document.getElementById(id);
function load(){
  const names=LAY.map(l=>l.id);
  names.forEach(n=>{const im=new Image();im.onload=()=>{loaded++;if(loaded+failed.length===names.length)ready();};im.onerror=()=>{failed.push(n);if(loaded+failed.length===names.length)ready();};im.src=BASE+'eir_p_'+n+'.webp';imgs[n]=im;});
  const pv=new Image();pv.src=BASE+'eir_p_preview.webp';imgs._pre=pv;
}
function ready(){ if(failed.length)$('msg').textContent='이미지 로딩 실패: '+failed.join(', ')+' (art/eir_p_*.webp 확인)'; requestAnimationFrame(frame); }
const E=(x)=>Math.exp(-x);
// 각 파츠의 로컬 변환(원본 캔버스 단위): {r:도, dx,dy, sx,sy}
function pose(id,t,a){
  const L=LAY.find(l=>l.id===id), p={r:0,dx:0,dy:0,sx:1,sy:1};
  const w=1.7, s=Math.sin;
  const lagS=(k)=>s(w*t-(L&&L.lag||0)*k);
  const lg=L&&L.lag?L.lag:0, am=L&&L.amp?L.amp:0;
  if(a==='idle'){
    if(id==='body'){p.dy=s(w*t)*3.2;p.sy=1+s(w*t)*0.004;p.sx=1-s(w*t)*0.002}
    else if(id==='head'){p.r=s(w*t-0.5)*1.1;p.dy=s(w*t-0.4)*0.8}
    else if(L&&L.amp){p.r=lagS(1)*am*0.6+s(w*t*0.55-lg)*am*0.4}
    if(id==='legs'){p.dy=s(w*t)*0.8}
  }else if(a==='hit'){
    const c=t%1.3, k=E(c*4.2), os=s(c*34)*k;
    if(id==='body'){p.dx=-26*k+os*3;p.dy=3*k;p.r=-2.2*k}
    else if(id==='head'){p.r=-9*k+os*2}
    else if(id==='arm_l'){p.r=14*k+os*3}
    else if(id==='arm_r'){p.r=-11*k+os*3}
    else if(L&&L.amp){p.r=(8+am*2)*k*(id==='scarf'?-1:1)+os*am}
  }else if(a==='attack'){
    const c=(t%1.4)/1.4, wind=c<0.28?c/0.28:0, swing=c>=0.28&&c<0.52?(c-0.28)/0.24:0, back=c>=0.52?(c-0.52)/0.48:0;
    const raise=wind*(-48)+swing*(-48+82)+(c>=0.52?(1-back)*34:0);
    const lean=c<0.28?-8*wind:c<0.52?-8+30*swing:22*(1-back);
    if(id==='body'){p.dx=lean;p.r=lean*0.12;p.dy=2*s(c*6.28)}
    else if(id==='arm_r'){p.r=raise}
    else if(id==='arm_l'){p.r=-raise*0.35}
    else if(id==='head'){p.r=lean*0.15}
    else if(L&&L.amp){p.r=-lean*0.25*am*0.5+s(w*3*t-lg)*am*0.8}
  }else if(a==='skill'){
    const c=t%2.6, up=Math.min(1,c/0.6), hold=c>0.6&&c<2.0?1:(c>=2.0?1-(c-2.0)/0.6:up);
    const k=c<0.6?up:hold;
    if(id==='body'){p.dy=-14*k+s(t*5)*1.2*k}
    else if(id==='arm_r'){p.r=-82*k+s(t*6)*2*k}
    else if(id==='arm_l'){p.r=-18*k}
    else if(id==='head'){p.r=-3*k+s(t*3)*0.8*k}
    else if(L&&L.amp){p.r=-6*k*am*0.5+s(w*2*t-lg)*am*0.9}
  }else if(a==='down'){
    const c=Math.min(1,(t%3.4)/1.5), k=c*c*(3-2*c);
    if(id==='body'){p.r=-76*k;p.dy=70*k;p.dx=-50*k}
    else if(id==='head'){p.r=-12*k}
    else if(id==='arm_l'){p.r=-22*k}
    else if(id==='arm_r'){p.r=28*k}
    else if(L&&L.amp){p.r=10*k*(id==='scarf'?-1:1)}
  }else if(a==='hurt'){
    const j=s(t*46)*2.2, j2=s(t*37+1)*1.6;
    if(id==='body'){p.dx=j*1.2;p.r=j2*0.3;p.dy=Math.abs(j2)*0.4}
    else if(id==='head'){p.r=j*0.8}
    else if(id==='arm_l'||id==='arm_r'){p.r=j2*1.1}
    else if(L&&L.amp){p.r=j*am*0.6}
  }
  return p;
}
function matFor(id,t,a,cache){
  if(cache[id])return cache[id];
  const L=LAY.find(l=>l.id===id), par=L.parent?matFor(L.parent,t,a,cache):new DOMMatrix();
  const p=pose(id,t,a), m=par.translate(L.pv[0]+p.dx,L.pv[1]+p.dy).rotate(p.r).scale(p.sx,p.sy).translate(-L.pv[0],-L.pv[1]);
  return cache[id]=m;
}
let frames=0,fpsT=performance.now(),fps='-';
function frame(now){
  const dt=(now-t0)/1000; t0=now; tAnim+=dt*speed;
  const cmp=$('cmp').checked, light=$('lt').checked;
  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle=light?'#f2f0f6':'#16161e';ctx.fillRect(0,0,cv.width,cv.height);
  const sc=Math.min(cv.width/CW,cv.height/CH);
  ctx.setTransform(sc,0,0,sc,(cv.width-CW*sc)/2,(cv.height-CH*sc)/2);
  const cache={}, a=cmp?'none':anim;
  if(a==='skill'||a==='attack'){ // 간단한 빛 이펙트(CSS 아님, 캔버스 그라디언트)
    const k=a==='skill'?(0.5+0.5*Math.sin(tAnim*4)):0;
    if(a==='skill'){const g=ctx.createRadialGradient(560,520,10,560,520,380);g.addColorStop(0,'rgba(170,215,255,'+(0.55*k+0.15)+')');g.addColorStop(1,'rgba(170,215,255,0)');ctx.fillStyle=g;ctx.fillRect(0,0,CW,CH);}
  }
  for(const L of LAY){
    if(!vis[L.id])continue; const im=imgs[L.id]; if(!im||!im.complete||!im.naturalWidth)continue;
    const m=cmp?new DOMMatrix():matFor(L.id,tAnim,a,cache), M=MAN[L.id];
    ctx.save(); ctx.transform(m.a,m.b,m.c,m.d,m.e,m.f); ctx.drawImage(im,M.x,M.y,M.w,M.h); ctx.restore();
  }
  if($('pre').checked&&imgs._pre&&imgs._pre.complete&&imgs._pre.naturalWidth){ctx.globalAlpha=0.45;ctx.drawImage(imgs._pre,0,0,CW,CH);ctx.globalAlpha=1;}
  if($('piv').checked){ctx.fillStyle='#ff3b6b';for(const L of LAY){const m=cmp?new DOMMatrix():matFor(L.id,tAnim,a,cache);const q=new DOMPoint(L.pv[0],L.pv[1]).matrixTransform(m);ctx.beginPath();ctx.arc(q.x,q.y,7,0,6.3);ctx.fill();}}
  frames++; if(now-fpsT>1000){fps=Math.round(frames*1000/(now-fpsT));frames=0;fpsT=now;$('fps').textContent='FPS '+(document.hidden?'-':fps);}
  requestAnimationFrame(frame);
}
// UI
const an=$('anims');ANIMS.forEach(n=>{const b=document.createElement('button');b.textContent=n.toUpperCase();b.onclick=()=>{anim=n;tAnim=0;$('an').textContent=n;[...an.children].forEach(c=>c.classList.toggle('on',c===b));};if(n==='idle')b.classList.add('on');an.appendChild(b);});
const sp=$('speeds');[1,2,3].forEach(v=>{const b=document.createElement('button');b.textContent='×'+v;b.onclick=()=>{speed=v;$('sp').textContent='속도 ×'+v;[...sp.children].forEach(c=>c.classList.toggle('on',c===b));};if(v===1)b.classList.add('on');sp.appendChild(b);});
const pr=$('parts');LAY.slice().reverse().forEach(L=>{const l=document.createElement('label');l.innerHTML='<input type="checkbox" checked> '+L.id;l.firstChild.onchange=e=>vis[L.id]=e.target.checked;pr.appendChild(l);});
load();
</script>
</body>
</html>
