<!-- 신흔 DIVINE TRACE — v0.1 뼈대 / 2026-09-27 / 새 코드베이스 (기존 NOCTURNE 코드와 무관) -->
<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0C0B0F">
<meta name="color-scheme" content="only light">
<meta name="supported-color-schemes" content="light">
<title>신흔 DIVINE TRACE (v4.44)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Song+Myung&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* ===== 신흔 DIVINE TRACE v0.1 — 스타일 (컨셉 v3: 검정·진홍·흰) ===== */
:root{
  --bg:#0C0B0F; --panel:rgba(18,16,22,.88); --line:rgba(255,255,255,.1);
  --red:#D6203F; --red2:#F04A63; --white:#F4F2F6; --silver:#BFC3CC; --muted:#8E8A99;
  --ally1:#7FCDB0; --ally2:#D9F5EA; --enemy1:#B0142F; --enemy2:#F04A63;
  --bb:'Bebas Neue',sans-serif; --sm:'Song Myung',serif; --body:'IBM Plex Sans KR',sans-serif;
  --rate:1;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#000;color:var(--white);font-family:var(--body);overflow:hidden;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:disabled{opacity:.4;cursor:default}
img{-webkit-user-drag:none;user-select:none}
#stage{position:fixed;inset:0;display:grid;place-items:center;background:#000}
#app{position:relative;width:390px;height:624px;overflow:hidden;background:var(--bg);transform-origin:center center}
.bb{font-family:var(--bb);letter-spacing:.06em}
.sm{font-family:var(--sm)}
.num{font-family:var(--bb);letter-spacing:.06em;font-variant-numeric:tabular-nums}
.cut-r{clip-path:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,0 100%)}
.cut-l{clip-path:polygon(10px 0,100% 0,100% 100%,0 100%,0 10px)}
.panel{background:var(--panel);border:1px solid var(--line);box-shadow:0 10px 24px rgba(0,0,0,.55)}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;gap:6px;padding:8px;overflow:hidden}
.bgimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}
.veil{position:absolute;inset:0;z-index:0;background:linear-gradient(180deg,rgba(12,11,15,.35),rgba(12,11,15,.15) 40%,rgba(12,11,15,.92))}
.screen>*:not(.bgimg):not(.veil){position:relative;z-index:1}
.btn{height:42px;padding:0 16px;font-family:var(--bb);font-size:18px;letter-spacing:.08em;color:var(--white);background:rgba(255,255,255,.1);display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.primary{background:var(--red);color:#fff}
.btn.ghost{background:transparent;border:1px solid rgba(255,255,255,.16);color:var(--silver);font-size:15px}
.tag{display:inline-flex;align-items:baseline;gap:6px;padding:2px 9px;background:rgba(12,11,15,.85);border-left:2px solid var(--red)}

/* ---- 공통 상단 ---- */
.topbar{height:34px;display:flex;align-items:flex-end;justify-content:space-between;gap:8px;padding-bottom:3px;border-bottom:1px solid var(--line)}
.topbar .left{display:flex;align-items:baseline;gap:7px;min-width:0;white-space:nowrap;overflow:hidden;flex:1 1 auto}
.topbar .right{flex:none;white-space:nowrap}
.topbar .stage-no{font-family:var(--bb);font-size:20px;line-height:1;color:var(--red)}
.topbar .stage-name{font-family:var(--sm);font-size:16px;line-height:1;white-space:nowrap}
.topbar .sep{width:1px;height:12px;background:rgba(255,255,255,.2);transform:skewX(-20deg)}
.topbar .turn{font-family:var(--bb);font-size:13px;line-height:1;color:var(--muted);white-space:nowrap}
.topbar .turn b{color:var(--white);font-weight:400}
.topbar .turn.act{margin-left:2px;padding-left:6px;border-left:1px solid rgba(255,255,255,.14)}
.topbar .right{display:flex;align-items:baseline;gap:8px;line-height:1}
.topbar .dps{font-family:var(--bb);font-size:12px;color:var(--red)}
.topbar .total{font-family:var(--bb);font-size:24px;color:var(--white)}

/* ---- 로비 ---- */
.lobby-title{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:6px 4px 0}
.lobby-title .kr{font-family:var(--sm);font-size:44px;line-height:1;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.8)}
.lobby-title .en{font-family:var(--bb);font-size:16px;letter-spacing:.34em;color:var(--red2);line-height:1}
.lobby-title .sub{font-size:10px;color:var(--silver);letter-spacing:.06em;margin-top:4px}
.lobby-wallet{position:absolute!important;z-index:2;right:8px;top:10px;display:flex;gap:10px;font-family:var(--bb);font-size:14px;color:var(--silver)}
.lobby-wallet b{color:#fff;font-weight:400}
.cloud{position:absolute!important;z-index:2;right:8px;top:30px;font-size:9px;letter-spacing:.06em;color:var(--muted);padding-left:10px}
.cloud:before{content:'';position:absolute;left:0;top:50%;width:5px;height:5px;margin-top:-2.5px;border-radius:50%;background:var(--muted)}
.cloud[data-s="cloud"]{color:var(--ally1)}.cloud[data-s="cloud"]:before{background:var(--ally1)}
.cloud[data-s="sync"]:before{background:#F2C96F;animation:breathe 1s ease-in-out infinite}
.cloud[data-s="off"]:before{background:var(--red)}
.lobby-hero{flex:1 1 auto;min-height:0;position:relative;display:flex;align-items:flex-end;justify-content:center}
.lobby-hero .art{width:300px;height:100%;max-height:420px;object-fit:contain;object-position:center bottom;filter:drop-shadow(0 20px 26px rgba(0,0,0,.8));mask-image:linear-gradient(180deg,#000 80%,transparent);-webkit-mask-image:linear-gradient(180deg,#000 80%,transparent)}
.lobby-hero .name{position:absolute;left:8px;bottom:8px;display:flex;flex-direction:column;gap:2px}
.lobby-hero .name .n{font-family:var(--sm);font-size:20px;color:#fff;text-shadow:0 2px 8px #000}
.lobby-hero .name .r{font-family:var(--bb);font-size:12px;letter-spacing:.2em;color:var(--red2)}
.lobby-actions{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.lobby-actions .btn{height:52px;font-size:20px}
.lobby-actions .btn small{font-family:var(--body);font-size:10px;letter-spacing:0;color:rgba(255,255,255,.7)}
.lobby-progress{display:flex;justify-content:space-between;align-items:baseline;padding:0 4px;font-family:var(--bb);font-size:12px;color:var(--muted)}
.lobby-progress b{color:var(--white);font-weight:400;font-size:14px}

/* ---- 편성 ---- */
.party-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;align-content:start;flex:1 1 auto;min-height:0;overflow:auto}
.hero-card{position:relative;aspect-ratio:3/4.4;overflow:hidden;background:#121016;box-shadow:inset 0 0 0 1px rgba(255,255,255,.14);text-align:left}
.hero-card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 8%}
.hero-card .shade{position:absolute;left:0;right:0;bottom:0;height:60%;background:linear-gradient(180deg,rgba(12,11,15,0),rgba(12,11,15,.96) 60%)}
.hero-card .meta{position:absolute;left:7px;right:6px;bottom:6px;display:flex;flex-direction:column;gap:3px}
.hero-card .meta .n{font-family:var(--sm);font-size:13px;color:#fff}
.hero-card .meta .lv{font-family:var(--bb);font-size:11px;color:var(--silver)}
.hero-card .meta .role{font-size:9px;color:var(--muted)}
.hero-card.picked{box-shadow:inset 0 0 0 1.5px #fff}
.hero-card.picked:before{content:'';position:absolute;left:0;top:0;width:3px;height:100%;background:var(--red);z-index:1}
.hero-card .slot{position:absolute;right:6px;top:6px;font-family:var(--bb);font-size:12px;padding:0 6px;height:16px;line-height:17px;background:var(--red);color:#fff}
.party-foot{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.party-note{font-size:10px;color:var(--muted);padding:0 4px}

/* ---- 모험 ---- */
.stage-list{display:flex;flex-direction:column;gap:6px;flex:1 1 auto;min-height:0;overflow:auto}
.stage-row{display:grid;grid-template-columns:52px minmax(0,1fr) auto;align-items:center;gap:10px;padding:8px 10px;background:var(--panel);border:1px solid var(--line);text-align:left}
.stage-row .no{font-family:var(--bb);font-size:22px;line-height:1;color:var(--red)}
.stage-row .nm{font-family:var(--sm);font-size:15px;color:#fff}
.stage-row .en{font-size:10px;color:var(--muted);margin-top:2px}
.stage-row .st{font-family:var(--bb);font-size:13px;color:var(--silver)}
.stage-row.locked{opacity:.4}
.stage-row.cleared .st{color:var(--ally1)}
.stage-row.boss .no{color:#fff}
.stage-row.boss{border-color:rgba(214,32,63,.6)}
.chapter-head{display:flex;align-items:baseline;gap:8px;padding:4px 4px 0}
.chapter-head .c{font-family:var(--bb);font-size:22px;color:var(--red);line-height:1}
.chapter-head .t{font-family:var(--sm);font-size:16px}
.adv-foot{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:6px}
.adv-foot .btn.off{opacity:.5}
.screen.raid .stage-row .no{font-size:17px}
.raid-lv{display:flex;flex-wrap:wrap;gap:6px;padding:8px 12px}
.raid-lv button{flex:1 0 17%;min-width:0;padding:8px 0;border:1px solid rgba(255,255,255,.2);background:rgba(0,0,0,.4);color:#fff;font-weight:700;border-radius:4px}
.raid-lv button.on{border-color:#e8c36a;color:#e8c36a}.raid-lv button.lk{opacity:.55}
.raid-det{margin:0 12px;padding:10px;text-align:center}.raid-det .nm{font-size:16px;font-weight:700}.raid-det .en{font-size:12px;margin:4px 0}.raid-det .btn{width:100%;margin-top:8px}

/* ---- 전투: HUD ---- */
.hud{height:44px;display:grid;grid-template-columns:minmax(0,1fr) 26px minmax(0,1fr);align-items:center;gap:8px;padding:6px 12px 7px}
.hud .side{display:flex;flex-direction:column;gap:4px;min-width:0}
.hud .lab{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--bb);line-height:1}
.hud .lab .k{font-size:12px;color:var(--silver)}
.hud .lab .k.boss{color:var(--red)}
.hud .lab .v{font-size:14px;color:#fff;white-space:nowrap}
.hud .lab .v span{color:var(--muted)}
.hud .vs{font-family:var(--bb);font-size:16px;line-height:1;color:var(--red);font-style:italic;text-align:center}
.bar{position:relative;height:5px;background:rgba(255,255,255,.08);overflow:visible}
.bar .fill,.bar .ghost{clip-path:inset(0)}
.bar i{position:absolute;top:0;bottom:0;left:0;display:block;height:100%}
.bar .ghost{display:none}
.bar .fill{transition:width calc(160ms / var(--rate)) cubic-bezier(.2,.8,.2,1)}
.bar .fill.healing{transition:width calc(760ms / var(--rate)) cubic-bezier(.2,.7,.2,1)}
/* 회복 예고 음영: 차오를 구간을 먼저 은은한 단색 음영으로 표시 (테두리 없음) */
.bar .gain{position:absolute;top:0;bottom:0;background:rgba(var(--gc),.28);pointer-events:none;z-index:0;animation:gainin calc(220ms / var(--rate)) ease-out both;--gc:191,245,221;transition:opacity calc(420ms / var(--rate))}
.bar.enemy .gain,.foe .bar .gain{--gc:255,150,170}
.bar .gain.done{opacity:0}
@keyframes gainin{0%{opacity:0;transform:scaleX(.6);transform-origin:left}100%{opacity:1;transform:scaleX(1)}}
.bar.enemy .gain{transform-origin:right}
/* 잃은 HP 조각: 그 구간이 음영으로 잠시 남았다가 안개처럼 흐려지며 위로 흩어짐 (히트마다 별도) + 작은 입자 */
.bar .lost{position:absolute;top:-1px;bottom:-1px;background:linear-gradient(180deg,rgba(var(--lc),.55),rgba(var(--lc),.9));border-radius:3px;box-shadow:0 0 6px rgba(var(--lc),.6);pointer-events:none;animation:lostfly calc(900ms / var(--rate)) cubic-bezier(.25,.1,.25,1) both;z-index:1;--lc:170,55,75;filter:blur(0px)}
.bar .mote{position:absolute;top:50%;width:3px;height:3px;margin:-1.5px 0 0 -1.5px;border-radius:50%;background:rgb(var(--lc));box-shadow:0 0 4px 1px rgba(var(--lc),.8);pointer-events:none;opacity:0;animation:motefly calc(820ms / var(--rate)) var(--d,0ms) ease-out both;z-index:2;--lc:170,55,75}
.bar.ally .lost,.card .bar .lost,.bar.ally .mote,.card .bar .mote{--lc:110,205,165}
.bar.enemy .lost,.foe .bar .lost,.bar.enemy .mote,.foe .bar .mote{--lc:240,90,115}
.card .bar .lost{top:0;bottom:0;border-radius:2px}
@keyframes motefly{0%{opacity:0;transform:translate(0,0) scale(var(--s,1))}20%{opacity:1}100%{opacity:0;transform:translate(var(--dx,0),-22px) scale(.3)}}
@keyframes lostfly{0%,22%{opacity:1;transform:translateY(0) scaleY(1);filter:blur(0)}55%{opacity:.6;filter:blur(1px)}100%{opacity:0;transform:translateY(-16px) scaleY(.35) scaleX(1.15);filter:blur(3px)}}
.bar.ally .fill{background:linear-gradient(90deg,var(--ally1),var(--ally2))}
.bar.enemy i{left:auto;right:0}
.bar.enemy .lost{left:auto}
.bar.enemy .fill{background:linear-gradient(270deg,var(--enemy1),var(--enemy2))}
.bar .snap{transition:none!important}

/* ---- 전투: 행동 순서 ---- */
.order{height:46px;display:flex;align-items:center;gap:10px;padding:0 2px}
.order .cap{display:flex;flex-direction:column;line-height:1;gap:2px;font-family:var(--bb);font-size:11px;color:var(--muted)}
.order .track{position:relative;flex:1 1 auto;height:46px;display:flex;align-items:center;gap:7px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;padding:0 3px;background:linear-gradient(180deg,transparent calc(50% - .5px),rgba(255,255,255,.14) calc(50% - .5px),rgba(255,255,255,.14) calc(50% + .5px),transparent calc(50% + .5px))}
.order .track::-webkit-scrollbar{display:none}
.order .rdiv{flex:none;display:flex;align-items:center;justify-content:center;width:16px;height:46px;position:relative}
.order .rdiv:before{content:'';position:absolute;left:50%;top:6px;bottom:6px;width:1px;background:var(--red);transform:skewX(-18deg)}
.order .rdiv span{position:absolute;left:50%;top:0;transform:translateX(-50%);font-family:var(--bb);font-size:9px;letter-spacing:.08em;color:var(--red2);background:var(--bg);padding:0 2px;line-height:1}
.chip.next{width:22px;height:22px;opacity:.6;box-shadow:0 0 0 1px var(--silver)}
.chip.next.enemy{box-shadow:0 0 0 1px var(--red)}
.chip{position:relative;width:27px;height:27px;border-radius:50%;overflow:hidden;background:#0C0B0F;box-shadow:0 0 0 1.5px var(--silver);flex:none;transition:width .15s,height .15s,transform .15s}
.chip img{display:none}
.chip.enemy{box-shadow:0 0 0 1.5px var(--red);background:#14101A}
.chip.enemy{background-color:#14101A}
.chip.now{width:40px;height:40px;box-shadow:0 0 0 2px #fff,0 0 0 4px rgba(214,32,63,.55)}
.chip.now:after{content:'NOW';position:absolute;left:50%;bottom:0;transform:translateX(-50%);padding:0 5px;height:11px;line-height:12px;font-family:var(--bb);font-size:9px;letter-spacing:.06em;background:var(--red);color:#fff}
.chip.empty{visibility:hidden}

/* ---- 전투: 전장 ---- */
.arena{position:relative;height:242px;overflow:hidden;box-shadow:inset 0 0 0 1px var(--line)}
.arena .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 70%;filter:saturate(.9) contrast(1.06)}
.arena .fog{position:absolute;inset:0;background:linear-gradient(180deg,rgba(12,11,15,.45),rgba(12,11,15,0) 30%,rgba(12,11,15,0) 62%,rgba(12,11,15,.85))}
.arena .floor{position:absolute;left:0;bottom:0;width:100%;height:2px;background:linear-gradient(90deg,rgba(214,32,63,0),var(--red) 50%,rgba(214,32,63,0))}
.foe{position:absolute;display:flex;flex-direction:column;align-items:center;transition:opacity .4s,filter .4s}
.foe .tag{font-size:8px;font-weight:600;color:#fff;white-space:nowrap}
.foe .tag .lv{font-family:var(--bb);font-size:9px;color:var(--silver)}
.foe .tag .boss{font-family:var(--bb);font-size:10px;color:var(--red)}
.foe .bar{width:70px;height:3px;margin-top:3px;background:rgba(0,0,0,.6)}
.foe .bar .fill{background:linear-gradient(90deg,var(--enemy1),var(--enemy2))}
.foe .bar i{left:0;right:auto}
.foe .shadow{position:absolute;left:50%;bottom:2px;width:70%;height:14px;transform:translateX(-50%);border-radius:50%;background:radial-gradient(ellipse at center,rgba(0,0,0,.75),rgba(0,0,0,0) 70%)}
.foe .sprite{position:relative;object-fit:contain;object-position:center bottom;animation:idle calc(3.6s / var(--rate)) ease-in-out infinite;transform-origin:50% 100%}
.foe.boss .sprite{filter:drop-shadow(0 0 14px rgba(214,32,63,.3))}
.foe.dead{opacity:0;filter:grayscale(1)}
.foe.targeted .marker{opacity:1}
.foe .marker{position:absolute;left:50%;top:44%;width:56px;height:56px;transform:translate(-50%,-50%);opacity:0;transition:opacity .2s;pointer-events:none}
.foe.wounded .sprite{filter:saturate(.7) brightness(.9) drop-shadow(0 0 12px rgba(214,32,63,.6))}

/* ---- 전투: 아군 카드 ---- */
.party-row{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;height:150px;overflow:visible}
.card{position:relative;overflow:hidden;background:#121016;box-shadow:inset 0 0 0 1px rgba(255,255,255,.14);transition:box-shadow .2s,filter .4s,transform calc(220ms / var(--rate)) cubic-bezier(.2,.8,.2,1)}
.card .art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 8%;transform-origin:50% 100%;transition:opacity calc(220ms / var(--rate)),transform calc(240ms / var(--rate)) cubic-bezier(.2,.8,.2,1)}
.card .art.fade{opacity:0}
.card.dead.alt .art{filter:saturate(.55) brightness(.75);transform:none;object-position:center 30%}
.card .shade{position:absolute;left:0;right:0;bottom:0;height:58%;background:linear-gradient(180deg,rgba(12,11,15,0),rgba(12,11,15,.96) 58%)}
.card .vign{position:absolute;inset:0;opacity:0;transition:opacity .4s;background:radial-gradient(ellipse at center,rgba(214,32,63,0) 45%,rgba(214,32,63,.55) 100%);pointer-events:none}
.card .meta{position:absolute;left:6px;right:5px;bottom:6px;display:flex;flex-direction:column;gap:3px;z-index:2}
.card .meta .n{font-family:var(--sm);font-size:11px;line-height:1;color:#fff;display:flex;justify-content:space-between;align-items:baseline}
.card .meta .n .lvtag{font-style:normal;font-family:var(--bb);font-size:9.5px;letter-spacing:.04em;color:var(--silver)}
.card .bar{height:13px;background:rgba(0,0,0,.55);box-shadow:inset 0 0 0 1px rgba(255,255,255,.14);overflow:visible}
.card .bar i{left:0;right:auto}
.card .bar .fill{background:linear-gradient(90deg,#2f8f73,var(--ally1))}
.card .hpv{position:absolute;left:4px;top:0;height:13px;line-height:13px;font-family:var(--bb);font-size:11px;color:#fff;text-shadow:0 1px 2px #000,0 0 3px #000;z-index:2;letter-spacing:0;white-space:nowrap}
.card .hpv span{color:rgba(255,255,255,.55);font-size:9px}
.card .skills{display:flex;align-items:center;justify-content:space-between;margin-top:1px}
.card .sk{width:22px;height:22px;display:grid;place-items:center;background:rgba(255,255,255,.1);box-shadow:inset 0 0 0 1px rgba(255,255,255,.25);clip-path:polygon(0 0,calc(100% - 6px) 0,100% 6px,100% 100%,0 100%);position:relative}
.card .sk.ready{background:var(--red);box-shadow:none}
.card .sk b{position:absolute;right:1px;bottom:0;font-family:var(--bb);font-size:9px;color:#fff;line-height:1}
.card .sk.ready b{display:none}
.card .sk svg{width:10px;height:10px}
.card .sk svg.ci{width:15px;height:15px}
.card .sk img.ci{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.card .sk.cool img.ci{opacity:.35;filter:grayscale(.5) brightness(.7)}
.card .sk.ready img.ci{filter:saturate(1.15)}
.card .sk.ready{box-shadow:inset 0 0 0 1px var(--red2),0 0 6px rgba(240,74,99,.5)}
.card .sk.sp.ready{box-shadow:inset 0 0 0 1px #F2C96F,0 0 8px rgba(242,201,111,.8)}
.card .sk.sp.ready img.ci{filter:saturate(1.2) brightness(1.1)}
.hero-detail .skrow .sk img.ci{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
/* 쿨다운 중: 살짝 음영 + 남은 턴 숫자 */
.card .sk.cool{background:rgba(0,0,0,.55);box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}
.card .sk.cool svg{opacity:.4;filter:grayscale(.4)}
.card .sk.cool b{right:0;bottom:0;left:0;top:0;display:grid;place-items:center;font-size:12px;color:#fff;text-shadow:0 0 4px #000,0 1px 2px #000}
.card .sk.cool b:after{content:'T';font-size:8px;color:var(--silver);margin-left:1px}
/* 특수스킬(전용 모션 컷인) 아이콘: 금색 테두리 + 좌상단 별 */
.card .sk.sp{box-shadow:inset 0 0 0 1px #F2C96F,0 0 6px rgba(242,201,111,.45)}
.card .sk.sp::before{content:'★';position:absolute;left:-3px;top:-6px;font-size:9px;color:#F2C96F;text-shadow:0 0 4px #000;line-height:1}
.card .sk.sp.ready{background:linear-gradient(135deg,#c9982f,#F2C96F);box-shadow:0 0 8px rgba(242,201,111,.7)}
.card .sk.sp.ready svg path{stroke:#1a1408}
.card .sk.sp.ready{animation:spready calc(1400ms / var(--rate)) ease-in-out infinite}
@keyframes spready{0%,100%{filter:brightness(1)}50%{filter:brightness(1.35)}}
.card.acting{box-shadow:inset 0 0 0 1.5px #fff,0 6px 16px rgba(0,0,0,.6);z-index:3}
.card.acting .art{transform:translateY(-10px) scale(1.07)}
.card.acting.sk-atk{--glow:214,32,63;animation:skglow calc(700ms / var(--rate)) ease-in-out infinite}
.card.acting.sk-heal{--glow:127,205,176;animation:skglow calc(700ms / var(--rate)) ease-in-out infinite}
.card.acting.sk-buff{--glow:242,201,111;animation:skglow calc(700ms / var(--rate)) ease-in-out infinite}
.card.acting.sk-debuff{--glow:180,140,255;animation:skglow calc(700ms / var(--rate)) ease-in-out infinite}
.card.acting[class*="sk-"] .art{transform:translateY(-14px) scale(1.09)}

@keyframes skglow{0%,100%{box-shadow:inset 0 0 0 1.5px rgb(var(--glow)),0 0 0 1px rgba(var(--glow),.6),0 0 14px rgba(var(--glow),.75),0 6px 16px rgba(0,0,0,.6)}50%{box-shadow:inset 0 0 0 2px #fff,0 0 0 2px rgba(var(--glow),.9),0 0 26px rgba(var(--glow),1),0 6px 16px rgba(0,0,0,.6)}}
.foe{transition:opacity .4s,filter .4s,transform calc(220ms / var(--rate)) cubic-bezier(.2,.8,.2,1)}
.foe.acting{transform:translateY(-8px);z-index:3}

.card.wounded .vign{opacity:1}
.card.wounded .art{filter:saturate(.8)}
.card.dead .art{filter:grayscale(1) brightness(.45);transform:translateY(14px);animation:none}
.card.dead .meta .n{color:var(--muted)}
.card.hit .art{animation:hit calc(420ms / var(--rate)) ease-out}
.card.hit .flash{opacity:1;animation:flash calc(420ms / var(--rate)) ease-out forwards}
.card .flash{position:absolute;inset:0;background:rgba(255,255,255,.55);opacity:0;pointer-events:none;mix-blend-mode:screen}
.foe.hit .sprite{animation:hit calc(420ms / var(--rate)) ease-out}
.card.healed .art{animation:heal calc(600ms / var(--rate)) ease-out}

/* ---- 피해 숫자 ---- */
.dmg{position:absolute;z-index:20;pointer-events:none;font-family:var(--bb);font-size:22px;line-height:1;color:#fff;text-shadow:0 0 2px #fff,0 2px 4px #000;animation:dmgfloat calc(900ms / var(--rate)) ease-out forwards;white-space:nowrap}
.dmg.crit{font-size:30px;color:#fff;text-shadow:0 0 2px #fff,0 0 12px rgba(214,32,63,.9),0 3px 4px #000}
.dmg.weak{color:#FFD7A8}
.dmg.heal{color:#BFF5DD}
.dmg small{display:block;font-size:9px;letter-spacing:.2em;color:var(--red2);text-align:left}
.dmg.heal small{color:#BFF5DD}

/* ---- 전투: 도크 ---- */
.dock{height:40px;display:flex;align-items:center;gap:5px;padding:4px 5px}
.dock .btn{height:30px;font-size:13px;padding:0 9px}
.dock .ico{width:44px;padding:0;border:1px solid rgba(255,255,255,.18);background:transparent}
.dock .auto{border:1px solid var(--red);background:rgba(214,32,63,.14);color:var(--red2)}
.dock .auto.off{border-color:rgba(255,255,255,.18);background:transparent;color:var(--muted)}
.dock .spd{display:flex;height:30px;border:1px solid rgba(255,255,255,.18);margin-left:auto}
.dock .spd button{width:34px;font-family:var(--bb);font-size:14px;color:var(--muted)}
.dock .spd button.on{background:var(--red);color:#fff}
.repeat-line{position:absolute!important;left:8px;right:8px;bottom:230px;z-index:1;display:none;align-items:center;justify-content:space-between;gap:8px;padding:4px 10px;background:rgba(12,11,15,.9);border-left:2px solid var(--red);font-family:var(--bb);font-size:12px;color:var(--silver)}
.repeat-line.on{display:flex}
.repeat-line b{color:#fff;font-weight:400}

/* ---- 컷인 ---- */
.cutin{position:absolute;left:0;right:0;top:62px;height:424px;z-index:30;overflow:hidden;background:#0C0B0F;pointer-events:none;animation:cutin-in calc(320ms / var(--rate)) cubic-bezier(.16,1,.3,1) both}
.cutin .glow{position:absolute;inset:0;background:radial-gradient(ellipse at 22% 34%,rgba(214,32,63,.45),rgba(214,32,63,0) 55%),radial-gradient(ellipse at 88% 70%,rgba(120,20,40,.5),rgba(120,20,40,0) 50%)}
.cutin .stripes{position:absolute;left:-140px;top:20px;width:760px;height:120px;transform:rotate(-18deg);background:repeating-linear-gradient(90deg,rgba(255,255,255,.035) 0 14px,rgba(255,255,255,0) 14px 42px)}
.cutin .art{position:absolute;left:-26px;top:-18px;width:440px;height:520px;object-fit:cover;object-position:center 8%;filter:contrast(1.1) saturate(1.05);mask-image:linear-gradient(180deg,#000 62%,transparent 96%);-webkit-mask-image:linear-gradient(180deg,#000 62%,transparent 96%);animation:cutin-art calc(1100ms / var(--rate)) ease-out both}
.cutin.enemy .art{object-fit:contain;object-position:center bottom;left:0;top:0;width:390px;height:400px}
.cutin .rim{position:absolute;inset:0;background:linear-gradient(90deg,rgba(214,32,63,.22),rgba(214,32,63,0) 45%,rgba(214,32,63,0) 70%,rgba(214,32,63,.18));mix-blend-mode:screen}
.cutin .ray{position:absolute;left:-80px;top:168px;width:600px;height:1.5px;transform:rotate(-18deg);background:linear-gradient(90deg,rgba(255,255,255,0),#fff 50%,rgba(255,255,255,0));animation:ray calc(700ms / var(--rate)) ease-out both}
.cutin .ray.r2{top:196px;height:1px;background:linear-gradient(90deg,rgba(214,32,63,0),var(--red2) 50%,rgba(214,32,63,0));animation-delay:calc(80ms / var(--rate))}
.cutin .band{position:absolute;left:-20px;right:-20px;top:296px;height:74px;transform:skewY(-5deg);background:rgba(12,11,15,.94);box-shadow:0 -1px 0 rgba(255,255,255,.12);animation:band calc(360ms / var(--rate)) calc(120ms / var(--rate)) cubic-bezier(.16,1,.3,1) both}
.cutin .band:after{content:'';position:absolute;left:0;right:0;bottom:-3px;height:3px;background:var(--red)}
.cutin .band:before{content:'';position:absolute;left:0;top:0;width:6px;height:100%;background:var(--red)}
.cutin .copy{position:absolute;left:24px;top:268px;display:flex;flex-direction:column;transform:skewY(-5deg);animation:copy calc(360ms / var(--rate)) calc(180ms / var(--rate)) cubic-bezier(.16,1,.3,1) both}
.cutin .copy small{font-family:var(--bb);font-size:14px;line-height:1;letter-spacing:.3em;color:var(--red2)}
.cutin .copy strong{margin-top:20px;font-family:var(--sm);font-size:40px;line-height:1;font-weight:400;color:#fff;letter-spacing:.02em;text-shadow:0 0 18px rgba(214,32,63,.55)}
.cutin .mult{position:absolute;right:18px;top:392px;font-family:var(--bb);font-size:16px;line-height:1;letter-spacing:.12em;color:var(--silver);transform:skewY(-5deg)}
.cutin .mult span{color:var(--muted)}
.cutin.out{animation:cutin-out calc(240ms / var(--rate)) ease-in both}
/* ---- 특수 컷인: 회중시계 ---- */
.cutin.gold .glow{background:radial-gradient(ellipse at 50% 20%,rgba(242,201,111,.35),rgba(242,201,111,0) 55%),radial-gradient(ellipse at 88% 70%,rgba(120,20,40,.5),rgba(120,20,40,0) 50%)}
.cutin.gold{--vr:1}
.cutin.gold .rig.pose{position:absolute;left:-5px;top:-24px;width:400px;height:600px;transform:translateY(-150px) scale(1.2);transform-origin:50% 40%;filter:contrast(1.08) saturate(1.05);transition:transform calc(780ms / var(--vr)) cubic-bezier(.45,0,.15,1)}
.cutin.gold .rig.pose .rl.body{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 0%}
.cutin.gold.raise .rig.pose{transform:translateY(0) scale(1.0)}
.cutin.gold.fire .rig.pose{transition-duration:calc(140ms / var(--vr));transform:translateY(-8px) scale(1.09)}
.cutin.gold.settle .rig.pose{transition-duration:calc(1100ms / var(--vr));transform:translateY(4px) translateX(3px) scale(1.0) rotate(.3deg)}
.cutin.gold .rig .rl.hair{animation:hairsway calc(3.2s / var(--rate)) ease-in-out infinite}
.cutin.gold .rig .rl.scarf{animation:scarfwave calc(2.8s / var(--rate)) ease-in-out infinite}
.cutin.gold .rig .rl.arm{display:none}
.cutin.gold .burst,.cutin.gold .rays,.cutin.gold .spark{position:absolute;width:0;height:0;pointer-events:none;transform:translate(-50%,-50%)}
.cutin.gold .burst{width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(255,250,225,1) 0%,rgba(255,225,140,.85) 14%,rgba(242,201,111,.35) 34%,rgba(242,201,111,0) 62%);opacity:0;transform:translate(-50%,-50%) scale(.2);mix-blend-mode:screen}
.cutin.gold .rays{width:520px;height:520px;border-radius:50%;background:repeating-conic-gradient(from 0deg,rgba(255,235,170,.55) 0deg 4deg,rgba(255,235,170,0) 4deg 18deg);mask-image:radial-gradient(circle,#000 0%,rgba(0,0,0,.6) 35%,transparent 62%);-webkit-mask-image:radial-gradient(circle,#000 0%,rgba(0,0,0,.6) 35%,transparent 62%);opacity:0;mix-blend-mode:screen}
.cutin.gold .spark{width:8px;height:8px;border-radius:50%;background:#fff;box-shadow:0 0 12px 6px rgba(255,240,200,.9);opacity:0}
.cutin.gold .flashw{position:absolute;inset:0;background:radial-gradient(circle at 50% 15%,rgba(255,245,215,.95),rgba(255,245,215,.35) 40%,rgba(255,245,215,0) 75%);opacity:0;pointer-events:none}
.cutin.gold.fire .burst{animation:wburst calc(900ms / var(--vr)) cubic-bezier(.1,.8,.2,1) both}
.cutin.gold.fire .rays{animation:wrays calc(1300ms / var(--vr)) ease-out both}
.cutin.gold.fire .spark{animation:wspark calc(600ms / var(--rate)) ease-out both}
.cutin.gold.fire .flashw{animation:wflash calc(520ms / var(--vr)) ease-out both}
.cutin.gold.fire{animation:cutshake calc(360ms / var(--vr)) ease-out both}
.cutin.gold .lines{position:absolute;inset:-40px;opacity:0;background:repeating-linear-gradient(180deg,rgba(255,240,200,0) 0 22px,rgba(255,240,200,.16) 22px 24px,rgba(255,240,200,0) 24px 38px);mask-image:linear-gradient(90deg,transparent,#000 20%,#000 80%,transparent);-webkit-mask-image:linear-gradient(90deg,transparent,#000 20%,#000 80%,transparent);pointer-events:none}
.cutin.gold.raise .lines{animation:speedlines calc(800ms / var(--vr)) ease-out both}
@keyframes speedlines{0%{opacity:0;transform:translateY(0) scaleY(1)}25%{opacity:1}100%{opacity:0;transform:translateY(-140px) scaleY(2.2)}}
@keyframes cutshake{0%,100%{transform:translate(0,0)}15%{transform:translate(-4px,3px)}35%{transform:translate(4px,-2px)}55%{transform:translate(-2px,2px)}75%{transform:translate(2px,-1px)}}
@keyframes armthrust{0%{transform:translateY(0) rotate(0)}30%{transform:translateY(-10px) rotate(-2.2deg)}100%{transform:translateY(-3px) rotate(-.6deg)}}
@keyframes hairblow{0%{transform:rotate(0) scaleY(1)}35%{transform:rotate(-2deg) scaleY(1.06) translateY(-4px)}100%{transform:rotate(0) scaleY(1)}}
@keyframes scarfblow{0%{transform:skewX(0)}35%{transform:skewX(-7deg) translateX(8px) translateY(-6px)}100%{transform:skewX(0)}}
.cutin.gold .band:after,.cutin.gold .band:before{background:#F2C96F}
.cutin.gold .copy small{color:#F2C96F}
.cutin.gold .copy strong{text-shadow:0 0 18px rgba(242,201,111,.7)}
@keyframes wburst{0%{opacity:0;transform:translate(-50%,-50%) scale(.2)}18%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}100%{opacity:.55;transform:translate(-50%,-50%) scale(1)}}
@keyframes wrays{0%{opacity:0;transform:translate(-50%,-50%) rotate(0deg) scale(.3)}25%{opacity:1}100%{opacity:.7;transform:translate(-50%,-50%) rotate(40deg) scale(1)}}
@keyframes wspark{0%{opacity:0;transform:translate(-50%,-50%) scale(.3)}30%{opacity:1;transform:translate(-50%,-50%) scale(2.6)}100%{opacity:.9;transform:translate(-50%,-50%) scale(1)}}
@keyframes wflash{0%{opacity:0}12%{opacity:1}100%{opacity:0}}
@keyframes wshake{0%{transform:translateY(0) scale(1)}20%{transform:translateY(-6px) scale(1.02)}55%{transform:translateY(2px) scale(1)}100%{transform:translateY(0) scale(1)}}
.dim{position:absolute;inset:0;z-index:29;background:rgba(0,0,0,.55);pointer-events:none}

/* ---- 결과 ---- */
.result .title{height:118px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.result .diamonds{display:flex;gap:8px;align-items:center}
.result .diamonds i{width:12px;height:12px;background:var(--red);transform:rotate(45deg);display:block}
.result .diamonds i.big{width:16px;height:16px}
.result .diamonds i.off{background:rgba(255,255,255,.18)}
.result .word{font-family:var(--bb);font-size:62px;line-height:.95;letter-spacing:.1em;color:#fff;text-shadow:0 2px 2px #000,0 0 26px rgba(214,32,63,.45)}
.result.defeat .word{color:var(--silver);text-shadow:0 2px 2px #000}
.result .kw{font-family:var(--sm);font-size:15px;line-height:1;color:#fff;margin:2px 0 4px;letter-spacing:.04em}
.result.defeat .kw{color:var(--red2);font-size:18px;text-shadow:0 0 14px rgba(214,32,63,.6)}
.result.defeat .diamonds i{background:rgba(255,255,255,.18)}
.result .rule{display:flex;align-items:center;gap:6px;width:200px}
.result .rule i{flex-grow:1;height:1px;background:rgba(255,255,255,.25)}
.result .rule b{width:34px;height:3px;background:var(--red);transform:skewX(-25deg)}
.result .meta{display:flex;align-items:baseline;gap:8px;margin-top:3px;font-family:var(--bb);line-height:1}
.result .meta .no{font-size:14px;color:var(--red)}
.result .meta .nm{font-family:var(--sm);font-size:13px}
.result .meta .t{font-size:13px;color:var(--muted)}
.result .totals{position:relative;padding:8px 12px 9px;display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr) minmax(0,1fr);align-items:center;gap:8px}
.result .totals:before{content:'';position:absolute;left:0;top:0;width:3px;height:100%;background:var(--red)}
.result .totals .k{font-family:var(--bb);font-size:11px;line-height:1;letter-spacing:.2em;color:var(--muted)}
.result .totals .v{font-family:var(--bb);line-height:1;color:#fff}
.result .totals .main{display:flex;flex-direction:column;gap:2px;padding-left:6px;border-right:1px solid var(--line)}
.result .totals .main .v{font-size:34px;line-height:.95}
.result .totals .sub{display:flex;flex-direction:column;gap:2px;align-items:center}
.result .totals .sub .v{font-size:22px}
.result .totals .sub .v.red{color:var(--red2)}
.result .totals .sub .v.sil{color:var(--silver)}
.result .contrib{padding:7px 8px 8px;display:flex;flex-direction:column;gap:6px;flex:1 1 auto;min-height:0}
.result .tabs{display:flex;border-bottom:1px solid var(--line)}
.result .tabs button{flex:1 1 0;height:24px;font-family:var(--bb);font-size:14px;color:var(--muted)}
.result .tabs button.on{color:#fff;border-bottom:2px solid var(--red)}
.result .rows{display:flex;flex-direction:column;gap:5px;overflow:auto}
.result .row{display:grid;grid-template-columns:28px minmax(0,1fr) 62px 38px;align-items:center;gap:8px}
.result .row .face{width:28px;height:28px;border-radius:50%;overflow:hidden;position:relative;box-shadow:0 0 0 1px rgba(255,255,255,.35)}
.result .row.top .face{box-shadow:0 0 0 1.5px #fff}
.result .row .face img{display:none}
.result .row .nm{font-family:var(--sm);font-size:11px;line-height:1}
.result .row .bar{height:3px;background:rgba(255,255,255,.1);margin-top:4px}
.result .row .bar i{left:0;right:auto;background:var(--silver)}
.result .row.top .bar i{background:var(--red)}
.result .row .v{font-family:var(--bb);font-size:16px;line-height:1;color:#fff;text-align:right}
.result .row .p{font-family:var(--bb);font-size:14px;line-height:1;color:var(--silver);text-align:right}
.result .row.top .p{color:var(--red2)}
.result .rewards{padding:7px 8px;display:flex;flex-direction:column;gap:6px}
.result .rewards .h{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--bb);line-height:1}
.result .rewards .h .k{font-size:12px;letter-spacing:.2em;color:var(--muted)}
.result .rewards .h .f{font-size:11px;letter-spacing:.12em;color:var(--red2)}
.result .rewards .tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.result .rewards .tile{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 2px;background:rgba(255,255,255,.05);box-shadow:inset 0 0 0 1px rgba(255,255,255,.1)}
.result .rewards .tile .k{font-family:var(--bb);font-size:10px;letter-spacing:.14em;color:var(--muted)}
.result .rewards .tile .v{font-family:var(--bb);font-size:15px;line-height:1;color:#fff}
.result .actions{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.result .actions .btn.sec{height:34px}
.lvup{font-family:var(--bb);font-size:11px;color:var(--ally2);letter-spacing:.1em}

/* ---- 토스트/오버레이 ---- */
.toast{position:absolute;left:50%;top:40%;transform:translateX(-50%);z-index:40;padding:10px 18px;background:rgba(12,11,15,.92);border-left:3px solid var(--red);font-family:var(--sm);font-size:16px;animation:toast 1.4s ease-out both;pointer-events:none;white-space:nowrap}
.pause{position:absolute;inset:0;z-index:35;display:grid;place-items:center;background:rgba(0,0,0,.6)}
.pause .box{display:flex;flex-direction:column;gap:8px;width:220px}
.pause .box .btn{height:44px}

/* ---- 애니메이션 ---- */
@keyframes idle{0%,100%{transform:translateY(0) scaleY(1)}50%{transform:translateY(-2px) scaleY(1.012)}}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.018)}}
@keyframes hit{0%{transform:translateX(0)}18%{transform:translateX(-6px) rotate(-1deg)}36%{transform:translateX(5px)}54%{transform:translateX(-3px)}72%{transform:translateX(2px)}100%{transform:translateX(0)}}
@keyframes flash{0%{opacity:.7}100%{opacity:0}}
@keyframes heal{0%{filter:brightness(1)}30%{filter:brightness(1.35) saturate(1.2)}100%{filter:brightness(1)}}
@keyframes dmgfloat{0%{opacity:0;transform:translate(-50%,6px) scale(.7)}12%{opacity:1;transform:translate(-50%,-6px) scale(1.15)}30%{transform:translate(-50%,-10px) scale(1)}100%{opacity:0;transform:translate(-50%,-44px) scale(1)}}
@keyframes cutin-in{0%{opacity:0;transform:translateX(-24px)}100%{opacity:1;transform:translateX(0)}}
@keyframes cutin-out{0%{opacity:1}100%{opacity:0}}
@keyframes cutin-art{0%{transform:translate(28px,10px) scale(1.06)}100%{transform:translate(0,0) scale(1)}}
@keyframes ray{0%{opacity:0;transform:rotate(-18deg) translateX(-200px)}40%{opacity:1}100%{opacity:0;transform:rotate(-18deg) translateX(200px)}}
@keyframes band{0%{transform:skewY(-5deg) translateX(-100%)}100%{transform:skewY(-5deg) translateX(0)}}
@keyframes copy{0%{opacity:0;transform:skewY(-5deg) translateX(-30px)}100%{opacity:1;transform:skewY(-5deg) translateX(0)}}
@keyframes toast{0%{opacity:0;transform:translate(-50%,8px)}15%{opacity:1;transform:translate(-50%,0)}80%{opacity:1}100%{opacity:0}}
body.motion-off .card .art,body.motion-off .foe .sprite{animation:none!important}
body.motion-off .bar i{transition:none!important}

/* ---------- 모험: 챕터 탭 + 배너 ---------- */
.ch-tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:2px 0 0}
.ch-tab{font-family:var(--bb);font-size:15px;letter-spacing:.06em;padding:7px 0 5px;background:var(--panel);border:1px solid var(--line);color:var(--silver);border-bottom:2px solid transparent}
.ch-tab.on{color:#fff;border-bottom-color:var(--red);background:rgba(214,32,63,.14)}
.ch-tab.locked{opacity:.35}
.ch-banner{position:relative;height:96px;overflow:hidden;border:1px solid var(--line);flex:0 0 auto}
.ch-banner img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 40%}
.ch-banner .shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(12,11,15,.88) 0%,rgba(12,11,15,.55) 55%,rgba(12,11,15,.1) 100%)}
.ch-banner .txt{position:absolute;left:12px;top:10px;right:56px;display:flex;flex-direction:column;gap:2px}
.ch-banner .c{font-family:var(--bb);font-size:11px;letter-spacing:.14em;color:var(--red)}
.ch-banner .t{font-family:var(--sm);font-size:20px;color:#fff;line-height:1.1;text-shadow:0 1px 6px rgba(0,0,0,.7)}
.ch-banner .d{font-size:10.5px;color:var(--silver);line-height:1.35;margin-top:3px;text-shadow:0 1px 4px rgba(0,0,0,.8)}
.ch-banner .prog{position:absolute;right:10px;bottom:8px;font-family:var(--bb);font-size:20px;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.8)}

/* ---------- 리그 공통 ---------- */
.rig{position:relative}
.rig .rl{position:absolute;pointer-events:none;-webkit-user-drag:none}
.rig .rl.body{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:contain}
.rig .rl.hair{transform-origin:50% 12%;animation:hairsway calc(3.4s / var(--rate)) ease-in-out infinite}
.rig .rl.scarf{transform-origin:15% 8%;animation:scarfwave calc(2.8s / var(--rate)) ease-in-out infinite}
.rig .rl.arm{transform-origin:70% 100%}
@keyframes hairsway{0%,100%{transform:rotate(-.7deg) translateX(-1px)}50%{transform:rotate(.7deg) translateX(1.5px)}}
@keyframes scarfwave{0%,100%{transform:skewX(-1.5deg) translateX(0)}50%{transform:skewX(2.2deg) translateX(3px) translateY(1px)}}
.wglow{position:absolute;width:22%;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(255,240,190,.55),rgba(255,220,140,.18) 45%,rgba(255,220,140,0) 70%);mix-blend-mode:screen;animation:wpulse calc(2.6s / var(--rate)) ease-in-out infinite;pointer-events:none}
@keyframes wpulse{0%,100%{opacity:.35;transform:translate(-50%,-50%) scale(.9)}50%{opacity:.9;transform:translate(-50%,-50%) scale(1.15)}}
.dust{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.dust i{position:absolute;bottom:-6px;border-radius:50%;background:#FFE7A8;box-shadow:0 0 6px 1px rgba(255,225,150,.8);opacity:0;animation:dustrise linear infinite}
@keyframes dustrise{0%{opacity:0;transform:translate(0,0) scale(.6)}15%{opacity:.9}80%{opacity:.5}100%{opacity:0;transform:translate(14px,-420px) scale(1.1)}}
/* 로비 리그 */
.lobby-rig{width:300px;height:400px;filter:drop-shadow(0 20px 26px rgba(0,0,0,.8));mask-image:linear-gradient(180deg,#000 82%,transparent);-webkit-mask-image:linear-gradient(180deg,#000 82%,transparent);animation:breathe calc(4s / var(--rate)) ease-in-out infinite;transform-origin:50% 100%}
.lobby-rig .rl.body{object-position:center bottom}
.lobby-hero .dust{z-index:1}
body.motion-off .rig .rl,body.motion-off .wglow,body.motion-off .dust i,body.motion-off .lobby-rig{animation:none!important}

/* ---------- 버프/디버프 칩 ---------- */
/* ---------- 버프/디버프 띠 (C타입, 애니 셀풍) ---------- */
.bstrip{position:absolute;left:3px;right:11px;top:3px;display:flex;justify-content:space-between;align-items:flex-start;z-index:4;pointer-events:none;min-height:0}
.bstrip .bgrp{display:flex;gap:1.5px}
.bc{position:relative;width:12px;height:12px;border-radius:2.5px;background:var(--bcc,#F2C96F);box-shadow:0 0 0 1.5px #111,0 1px 0 1.5px rgba(0,0,0,.35);display:grid;place-items:center;flex:none}
.bc svg{width:9px;height:9px}
.bc b{position:absolute;left:-2px;right:-2px;top:12px;font:700 8.5px/9px var(--body);color:#fff;text-align:center;text-shadow:0 0 2px #000,0 1px 0 #000,1px 0 0 #000,-1px 0 0 #000}
.bc.up.atk{--bcc:#F2C96F}.bc.up.def{--bcc:#7FB2E8}.bc.up.heal{--bcc:#7FCDB0}.bc.up.spd{--bcc:#8FD3FF}
.bc.down{--bcc:#8E5BF0}.bc.st{--bcc:#E23B4E}
.bc.more{background:#2a2630;color:#fff;font:700 7.5px/12px var(--body);text-align:center}
.bc.new{animation:bcpop calc(360ms / var(--rate)) cubic-bezier(.2,1.4,.4,1) both}
.bc.last{animation:bcblink calc(900ms / var(--rate)) ease-in-out infinite}
.bc.new.last{animation:bcpop calc(360ms / var(--rate)) cubic-bezier(.2,1.4,.4,1) both,bcblink calc(900ms / var(--rate)) calc(400ms / var(--rate)) ease-in-out infinite}
@keyframes bcpop{0%{transform:scale(.3);opacity:0}60%{transform:scale(1.25);opacity:1}100%{transform:scale(1)}}
@keyframes bcblink{0%,100%{filter:brightness(1)}50%{filter:brightness(.55)}}
.card .meta{padding-top:0}
/* 적: 이름표 아래 가운데 정렬, 조금 더 작게 */
.foe .bstrip{position:static;justify-content:center;gap:6px;margin-top:3px;min-height:0}
.foe .bc{width:12px;height:12px}
.foe .bc svg{width:9px;height:9px}
.foe .bc b{top:12px;font-size:8px}
.foe .bstrip:empty,.card .bstrip:empty{display:none}

/* ---------- 스킬 이펙트 ---------- */
.fx{position:absolute;inset:0;pointer-events:none;z-index:6;overflow:visible}
.foe .fx{top:auto;bottom:0;height:100%}
.fx b{position:absolute;left:50%;top:45%;width:60px;height:60px;transform:translate(-50%,-50%) scale(.2);border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.95),rgba(255,180,190,.6) 30%,rgba(214,32,63,0) 70%);mix-blend-mode:screen;animation:fxpop calc(420ms / var(--rate)) ease-out both}
.fx-hit b{width:44px;height:44px}
.fx i{position:absolute;left:50%;top:45%;width:110px;height:3px;background:linear-gradient(90deg,rgba(255,255,255,0),#fff 35%,#F04A63 65%,rgba(240,74,99,0));box-shadow:0 0 8px rgba(240,74,99,.9);transform-origin:50% 50%;opacity:0}
.fx-slash .s1{animation:fxslash calc(380ms / var(--rate)) ease-out both;transform:translate(-50%,-50%) rotate(-32deg)}
.fx-slash .s2{animation:fxslash calc(380ms / var(--rate)) calc(70ms / var(--rate)) ease-out both;transform:translate(-50%,-50%) rotate(28deg);height:2px}
.fx-multi .s1{animation:fxslash calc(300ms / var(--rate)) ease-out both;transform:translate(-50%,-50%) rotate(-40deg)}
.fx-multi .s2{animation:fxslash calc(300ms / var(--rate)) calc(60ms / var(--rate)) ease-out both;transform:translate(-50%,-50%) rotate(12deg)}
.fx-multi .s3{animation:fxslash calc(300ms / var(--rate)) calc(120ms / var(--rate)) ease-out both;transform:translate(-50%,-50%) rotate(55deg)}
.fx-multi b{background:radial-gradient(circle,rgba(255,255,255,.95),rgba(255,200,120,.6) 30%,rgba(255,120,40,0) 70%)}
@keyframes fxpop{0%{opacity:0;transform:translate(-50%,-50%) scale(.2)}25%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.5)}}
@keyframes fxslash{0%{opacity:0;clip-path:inset(0 100% 0 0)}20%{opacity:1;clip-path:inset(0 0 0 0)}100%{opacity:0;clip-path:inset(0 0 0 100%)}}
.fx .arr{position:absolute;left:30%;bottom:20%;width:10px;height:10px;border-left:2px solid var(--fxc);border-top:2px solid var(--fxc);transform:rotate(45deg);opacity:0;animation:fxrise calc(800ms / var(--rate)) ease-out both}
.fx .arr.a2{left:50%;animation-delay:calc(120ms / var(--rate))}.fx .arr.a3{left:70%;animation-delay:calc(240ms / var(--rate))}
.fx em{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);font-style:normal;font-family:var(--bb);font-size:15px;letter-spacing:.1em;color:var(--fxc);text-shadow:0 0 10px var(--fxc),0 1px 2px #000;animation:fxlabel calc(800ms / var(--rate)) ease-out both;white-space:nowrap}
.fx-buff{--fxc:#F2C96F;background:radial-gradient(ellipse at 50% 100%,rgba(242,201,111,.35),rgba(242,201,111,0) 70%);animation:fxglow calc(800ms / var(--rate)) ease-out both}
.fx-shield{--fxc:#7FB2E8;background:radial-gradient(ellipse at 50% 100%,rgba(127,178,232,.35),rgba(127,178,232,0) 70%);animation:fxglow calc(800ms / var(--rate)) ease-out both}
.fx-debuff{--fxc:#B48CFF;background:radial-gradient(ellipse at 50% 0%,rgba(180,140,255,.4),rgba(180,140,255,0) 70%);animation:fxglow calc(800ms / var(--rate)) ease-out both}
.fx-debuff .arr{transform:rotate(225deg);bottom:auto;top:15%;animation-name:fxfall}
@keyframes fxrise{0%{opacity:0;transform:translateY(10px) rotate(45deg)}30%{opacity:1}100%{opacity:0;transform:translateY(-46px) rotate(45deg)}}
@keyframes fxfall{0%{opacity:0;transform:translateY(-10px) rotate(225deg)}30%{opacity:1}100%{opacity:0;transform:translateY(46px) rotate(225deg)}}
@keyframes fxlabel{0%{opacity:0;transform:translate(-50%,-30%) scale(.7)}25%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}70%{opacity:1}100%{opacity:0;transform:translate(-50%,-80%) scale(1)}}
@keyframes fxglow{0%{opacity:0}20%{opacity:1}100%{opacity:0}}
.fx-heal .p{position:absolute;left:25%;bottom:15%;width:5px;height:5px;border-radius:50%;background:#BFF5DD;box-shadow:0 0 8px 2px rgba(127,205,176,.9);opacity:0;animation:fxrise2 calc(850ms / var(--rate)) ease-out both}
.fx-heal .p2{left:45%;animation-delay:calc(90ms / var(--rate))}.fx-heal .p3{left:62%;animation-delay:calc(180ms / var(--rate));width:4px;height:4px}.fx-heal .p4{left:78%;animation-delay:calc(260ms / var(--rate))}
@keyframes fxrise2{0%{opacity:0;transform:translateY(8px) scale(.5)}25%{opacity:1}100%{opacity:0;transform:translateY(-70px) scale(1.2)}}
/* 전체 공격: 전장 흔들림 + 휩쓸기 */
.arena.rumble{animation:rumble calc(520ms / var(--rate)) ease-out both}
@keyframes rumble{0%,100%{transform:translate(0,0)}10%{transform:translate(-5px,2px)}25%{transform:translate(4px,-3px)}40%{transform:translate(-4px,1px)}55%{transform:translate(3px,2px)}70%{transform:translate(-2px,-1px)}85%{transform:translate(1px,1px)}}
.arena .sweep{position:absolute;inset:-20px;z-index:5;pointer-events:none;background:repeating-linear-gradient(-20deg,rgba(255,255,255,0) 0 18px,rgba(255,240,220,.28) 18px 20px,rgba(255,255,255,0) 20px 40px),linear-gradient(90deg,rgba(240,74,99,0),rgba(240,74,99,.28),rgba(240,74,99,0));mix-blend-mode:screen;animation:sweep calc(600ms / var(--rate)) ease-out both}
@keyframes sweep{0%{opacity:0;transform:translateX(-120%)}30%{opacity:1}100%{opacity:0;transform:translateX(120%)}}

/* ---------- 기본 스킬 배너 (s2) ---------- */
.qskill{position:absolute;left:0;right:0;top:150px;z-index:28;height:34px;display:flex;align-items:center;gap:10px;padding:0 14px;background:linear-gradient(90deg,rgba(12,11,15,0),rgba(12,11,15,.92) 20%,rgba(12,11,15,.92) 80%,rgba(12,11,15,0));pointer-events:none;animation:qin calc(260ms / var(--rate)) cubic-bezier(.16,1,.3,1) both;--qc:var(--red2)}
.qskill:before{content:'';position:absolute;left:14%;right:14%;bottom:0;height:2px;background:linear-gradient(90deg,transparent,var(--qc),transparent)}
.qskill .who{font-family:var(--bb);font-size:12px;letter-spacing:.2em;color:var(--qc)}
.qskill .nm{font-family:var(--sm);font-size:19px;color:#fff;text-shadow:0 0 12px var(--qc)}
.qskill.enemy{justify-content:flex-end}
.qskill.out{animation:qout calc(200ms / var(--rate)) ease-in both}
@keyframes qin{0%{opacity:0;transform:translateX(-30px)}100%{opacity:1;transform:translateX(0)}}
@keyframes qout{0%{opacity:1}100%{opacity:0;transform:translateX(30px)}}

/* ---------- 컷인 속성 테마 ---------- */
.cutin,.qskill{--ct:214,32,63}
.cutin.t-aoe,.qskill.t-aoe{--ct:255,120,40;--qc:#FF8A3D}
.cutin.t-heal,.qskill.t-heal{--ct:127,205,176;--qc:#7FCDB0}
.cutin.t-buff,.qskill.t-buff{--ct:242,201,111;--qc:#F2C96F}
.cutin.t-debuff,.qskill.t-debuff{--ct:180,140,255;--qc:#B48CFF}
.cutin:not(.gold) .glow{background:radial-gradient(ellipse at 22% 34%,rgba(var(--ct),.45),rgba(var(--ct),0) 55%),radial-gradient(ellipse at 88% 70%,rgba(var(--ct),.3),rgba(var(--ct),0) 50%)}
.cutin:not(.gold) .rim{background:linear-gradient(90deg,rgba(var(--ct),.22),rgba(var(--ct),0) 45%,rgba(var(--ct),0) 70%,rgba(var(--ct),.18))}
.cutin:not(.gold) .ray.r2{background:linear-gradient(90deg,rgba(var(--ct),0),rgb(var(--ct)) 50%,rgba(var(--ct),0))}
.cutin:not(.gold) .band:after,.cutin:not(.gold) .band:before{background:rgb(var(--ct))}
.cutin:not(.gold) .copy small{color:rgb(var(--ct))}
.cutin:not(.gold) .copy strong{text-shadow:0 0 18px rgba(var(--ct),.55)}
.cutin .slashes{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.cutin .slashes i{position:absolute;left:-30%;width:160%;height:3px;background:linear-gradient(90deg,rgba(255,255,255,0),#fff 40%,rgba(var(--ct),1) 60%,rgba(255,255,255,0));box-shadow:0 0 10px rgba(var(--ct),.9);transform:rotate(-24deg);opacity:0}
.cutin .slashes i:nth-child(1){top:120px;animation:cslash calc(500ms / var(--rate)) calc(200ms / var(--rate)) ease-out both}
.cutin .slashes i:nth-child(2){top:190px;transform:rotate(-18deg);animation:cslash calc(500ms / var(--rate)) calc(330ms / var(--rate)) ease-out both}
.cutin .slashes i:nth-child(3){top:250px;transform:rotate(-28deg);animation:cslash calc(500ms / var(--rate)) calc(460ms / var(--rate)) ease-out both}
@keyframes cslash{0%{opacity:0;clip-path:inset(0 100% 0 0)}15%{opacity:1;clip-path:inset(0 0 0 0)}100%{opacity:0;clip-path:inset(0 0 0 100%)}}
.cutin.t-aoe{animation:cutin-in calc(320ms / var(--rate)) cubic-bezier(.16,1,.3,1) both,cutshake calc(700ms / var(--rate)) calc(300ms / var(--rate)) ease-out both}


/* ---------- 최소 동작 영상 컷인 + 카메라 모션 ---------- */
.cutin.flip .frames{position:absolute;left:50%;top:0;width:424px;height:424px;transform:translateX(-50%) scale(1.03);transform-origin:50% 45%;transition:transform calc(760ms / var(--vr)) cubic-bezier(.3,.6,.3,1)}
.cutin.flip .frames .vid{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:contrast(1.06) saturate(1.05);opacity:0;transition:opacity 120ms}
.cutin.flip.vready .frames .vid{opacity:1}
.cutin.flip .frames .poster{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 0%;filter:contrast(1.06) saturate(1.05)}
.cutin.flip.raise .frames{transform:translateX(-50%) scale(1.12) translateY(-8px)}
.cutin.flip.cut .frames{transition-duration:calc(120ms / var(--vr));transform:translateX(-50%) scale(1.24) translateY(-16px)}
.cutin.flip.settle .frames{transition-duration:calc(1200ms / var(--vr));transform:translateX(-49%) scale(1.06) translateY(-2px) rotate(.4deg)}
.cutin.flip.cut .flashw{animation:wflash calc(380ms / var(--vr)) ease-out both}
.cutin.flip.fire .burst{animation:wburst calc(900ms / var(--vr)) cubic-bezier(.1,.8,.2,1) both}
.cutin.flip.fire .rays{animation:wrays calc(1300ms / var(--vr)) ease-out both}
.cutin.flip.fire{animation:cutshake calc(300ms / var(--vr)) ease-out both}
.cutin.flip.raise .lines{animation:speedlines calc(800ms / var(--vr)) ease-out both;opacity:.5}
.cutin.flip .burst{width:300px;height:300px}

/* ---------- 저장 코드 대화상자 ---------- */
.pause .box.wide{width:340px;background:rgba(18,16,22,.96);border:1px solid var(--line);padding:12px;gap:8px}
.pause .box .h{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--sm);font-size:18px}
.pause .box .h small{font-family:var(--bb);font-size:11px;color:var(--muted);letter-spacing:.08em}
.pause .box .note{font-size:11px;color:var(--silver);line-height:1.4;margin:0}
.pause .box textarea.code{width:100%;height:64px;resize:none;font:10px/1.35 monospace;color:var(--silver);background:rgba(0,0,0,.5);border:1px solid var(--line);padding:6px;word-break:break-all}
.pause .box textarea.code.in{color:#fff}
.pause .box .row{display:flex;gap:6px}
.pause .box .row .btn{flex:1 1 0;height:38px;font-size:14px}
button.cloud{text-align:left;cursor:pointer}

/* ---------- 일반 스킬 미니 컷인 (속성별 디자인) ---------- */
.mini{--ct:214,32,63;position:absolute;left:0;top:156px;z-index:28;width:300px;height:78px;pointer-events:none;animation:miniin calc(240ms / var(--rate)) cubic-bezier(.16,1,.3,1) both}
.mini.enemy{left:auto;right:0;animation-name:miniin-r}
.mini.out{animation:miniout calc(200ms / var(--rate)) ease-in both}
.mini .band{position:absolute;left:-30px;top:14px;width:330px;height:52px;background:linear-gradient(90deg,rgba(var(--ct),.95),rgba(var(--ct),.75) 60%,rgba(var(--ct),0));transform:skewX(-14deg);overflow:hidden;box-shadow:0 6px 18px rgba(0,0,0,.5)}
.mini.enemy .band{left:auto;right:-30px;background:linear-gradient(270deg,rgba(var(--ct),.95),rgba(var(--ct),.75) 60%,rgba(var(--ct),0));transform:skewX(14deg)}

.mini .face img{position:absolute;left:50%;top:0;width:170%;transform:translateX(-50%)}
.mini.enemy .face{left:auto;right:10px}
.mini.enemy .face img{width:120%;top:-2px}
.mini .txt{position:absolute;left:92px;top:18px;display:flex;flex-direction:column;gap:2px;transform:skewX(-6deg)}
.mini.enemy .txt{left:auto;right:92px;align-items:flex-end;transform:skewX(6deg)}
.mini .who{font-family:var(--bb);font-size:11px;letter-spacing:.2em;color:rgba(255,255,255,.85)}
.mini .nm{font-family:var(--sm);font-size:21px;line-height:1;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.7),0 0 12px rgba(var(--ct),.9);white-space:nowrap}
@keyframes miniin{0%{opacity:0;transform:translateX(-40px)}100%{opacity:1;transform:translateX(0)}}
@keyframes miniin-r{0%{opacity:0;transform:translateX(40px)}100%{opacity:1;transform:translateX(0)}}
@keyframes miniout{0%{opacity:1}100%{opacity:0;transform:translateY(-8px)}}
/* 테마 색 */
.mini.t-aoe{--ct:255,120,40}.mini.t-heal{--ct:127,205,176}.mini.t-buff{--ct:242,201,111}.mini.t-debuff{--ct:180,140,255}
/* 공격: 흰 참격선이 띠를 가로지름 */
.mini.t-atk .sl{position:absolute;left:-20%;top:50%;width:140%;height:2px;background:linear-gradient(90deg,rgba(255,255,255,0),#fff 40%,rgba(255,255,255,0));transform:rotate(-6deg);animation:minisl calc(420ms / var(--rate)) calc(120ms / var(--rate)) ease-out both}
@keyframes minisl{0%{opacity:0;clip-path:inset(0 100% 0 0)}20%{opacity:1;clip-path:inset(0 0 0 0)}100%{opacity:0;clip-path:inset(0 0 0 100%)}}
/* 전체: 사선 줄무늬 3개가 흐름 */
.mini.t-aoe .st{position:absolute;top:-10px;width:14px;height:80px;background:rgba(255,255,255,.35);transform:rotate(20deg);animation:minist calc(600ms / var(--rate)) linear infinite}
.mini.t-aoe .st.s2{animation-delay:calc(-200ms / var(--rate));opacity:.7}.mini.t-aoe .st.s3{animation-delay:calc(-400ms / var(--rate));opacity:.5}
@keyframes minist{0%{left:-20px}100%{left:340px}}
/* 회복: 입자 상승 */
.mini.t-heal .band{border-radius:26px 0 0 26px}
.mini.t-heal .p{position:absolute;bottom:-4px;width:6px;height:6px;border-radius:50%;background:#E8FFF5;box-shadow:0 0 8px 2px rgba(191,245,221,.9);opacity:0;animation:minip calc(700ms / var(--rate)) ease-out infinite}
.mini.t-heal .p{left:110px}.mini.t-heal .p2{left:160px;animation-delay:calc(150ms / var(--rate))}.mini.t-heal .p3{left:210px;animation-delay:calc(300ms / var(--rate))}.mini.t-heal .p4{left:255px;animation-delay:calc(80ms / var(--rate))}
@keyframes minip{0%{opacity:0;transform:translateY(6px)}30%{opacity:1}100%{opacity:0;transform:translateY(-52px)}}
/* 버프/디버프: 화살(쉐브론) 상승/하강 */
.mini .ch{position:absolute;width:12px;height:12px;border-left:3px solid rgba(255,255,255,.9);border-top:3px solid rgba(255,255,255,.9);transform:rotate(45deg);opacity:0;animation:minich calc(700ms / var(--rate)) ease-out infinite}
.mini .ch{left:120px;bottom:6px}.mini .ch.c2{left:175px;animation-delay:calc(160ms / var(--rate))}.mini .ch.c3{left:230px;animation-delay:calc(320ms / var(--rate))}
.mini .ch.dn{transform:rotate(225deg);bottom:auto;top:6px;animation-name:minichdn}
@keyframes minich{0%{opacity:0;transform:translateY(10px) rotate(45deg)}30%{opacity:1}100%{opacity:0;transform:translateY(-34px) rotate(45deg)}}
@keyframes minichdn{0%{opacity:0;transform:translateY(-10px) rotate(225deg)}30%{opacity:1}100%{opacity:0;transform:translateY(34px) rotate(225deg)}}

/* ---------- 특수스킬 임시 풀 컷인 (전용 모션 준비 전): 금색 프레임 + SPECIAL ---------- */
.cutin.sp:not(.gold){box-shadow:inset 0 0 0 2px #F2C96F,inset 0 0 40px rgba(242,201,111,.25)}
.cutin.sp:not(.gold) .copy small{color:#F2C96F}
.cutin.sp:not(.gold) .band:before,.cutin.sp:not(.gold) .band:after{background:linear-gradient(90deg,#F2C96F,rgb(var(--ct)))}
.cutin.sp:not(.gold) .stripes{background:repeating-linear-gradient(90deg,rgba(242,201,111,.08) 0 14px,rgba(255,255,255,0) 14px 42px)}

/* ---------- 버프 오라: 일러스트 외곽이 버프 색으로 은은하게 빛남 (방어=푸른빛, 공격=금빛, 디버프=보랏빛, 중첩=혼합색) ---------- */
.card .aura{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .5s;z-index:1;--ac:127,178,232}
.card.aura-on .aura{opacity:1;animation:aura calc(2.4s / var(--rate)) ease-in-out infinite}
.card.dead .aura{opacity:0!important;animation:none}
@keyframes aura{0%,100%{box-shadow:inset 0 0 8px 1px rgba(var(--ac),.4),inset 0 0 0 1px rgba(var(--ac),.55)}50%{box-shadow:inset 0 0 13px 3px rgba(var(--ac),.65),inset 0 0 0 1.5px rgba(var(--ac),.9)}}
.foe.aura-on .sprite{filter:drop-shadow(0 0 8px rgba(var(--ac,180,140,255),.8))}
.foe.dead .sprite{filter:grayscale(1)}
.foe .aura{display:none}

/* ---------- 캐릭터 상세 ---------- */
.hero-detail{padding:0!important;overflow:hidden;gap:0!important}

.hero-detail .hd img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 10%}

.hero-detail .hd .nm{position:absolute;left:12px;bottom:8px;display:flex;flex-direction:column;gap:2px}
.hero-detail .hd .r{font-family:var(--bb);font-size:11px;letter-spacing:.16em;color:var(--red2)}
.hero-detail .hd .n{font-family:var(--sm);font-size:24px;color:#fff;line-height:1}
.hero-detail .hd .lv{font-family:var(--bb);font-size:13px;color:var(--silver)}
.hero-detail .hd .lv small{font-size:10px;color:var(--muted);letter-spacing:.06em}
.hero-detail .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:10px 12px 4px}
.hero-detail .stats div{display:flex;flex-direction:column;gap:2px;padding:6px 8px;background:rgba(255,255,255,.05);box-shadow:inset 0 0 0 1px rgba(255,255,255,.1)}
.hero-detail .stats .k{font-size:9.5px;color:var(--muted);letter-spacing:.06em}
.hero-detail .stats b{font-family:var(--bb);font-size:18px;line-height:1;color:#fff;font-weight:400}
.hero-detail .stats small{font-family:var(--bb);font-size:10px;color:var(--red2)}

.hero-detail .skrow .sk svg{width:20px;height:20px}
.hero-detail .skrow .sk.sp{box-shadow:inset 0 0 0 1px #F2C96F,0 0 8px rgba(242,201,111,.5)}
.hero-detail .skn{font-family:var(--sm);font-size:14px;color:#fff}
.hero-detail .skn small{font-family:var(--bb);font-size:10px;color:#F2C96F;letter-spacing:.06em;margin-left:4px}
.hero-detail .skd{font-size:10.5px;color:var(--silver);margin-top:1px}
.hero-detail .row{padding:6px 12px 12px}

/* ---------- 이펙트 간소화(FX OFF): 카드 발광·오라 펄스·HP 입자 최소화 ---------- */
body.fx-off .card.acting[class*="sk-"]{animation:none}
body.fx-off .bar .mote{display:none}

.mini.sp .band{box-shadow:0 6px 18px rgba(0,0,0,.5),inset 0 0 0 1px #F2C96F}

/* ---------- 전투 전체 배경(챕터 배경 흐림) ---------- */
.screen.battle .bgimg.deep{filter:blur(7px) brightness(.32) saturate(.8);transform:scale(1.08)}
.screen.battle .veil.deep{background:radial-gradient(ellipse at 50% 42%,rgba(12,11,15,.15),rgba(12,11,15,.75) 75%),linear-gradient(180deg,rgba(12,11,15,.55),rgba(12,11,15,.2) 40%,rgba(12,11,15,.9))}

/* 배속 잠금 */
.dock .spd button.lock{color:rgba(255,255,255,.22);position:relative}

/* ---------- 전투 전환 배너 ---------- */
.sbanner{position:absolute;left:0;right:0;top:150px;z-index:34;display:flex;flex-direction:column;align-items:center;gap:4px;padding:16px 0;background:linear-gradient(90deg,rgba(12,11,15,0),rgba(12,11,15,.94) 18%,rgba(12,11,15,.94) 82%,rgba(12,11,15,0));pointer-events:none;animation:sbin calc(var(--d) * .18) cubic-bezier(.16,1,.3,1) both}
.sbanner.out{animation:sbout calc(var(--d) * .17) ease-in both}
.sbanner:before,.sbanner:after{content:'';position:absolute;left:14%;right:14%;height:2px;background:linear-gradient(90deg,transparent,var(--red),transparent)}
.sbanner:before{top:0}.sbanner:after{bottom:0}
.sbanner .k{font-family:var(--bb);font-size:13px;letter-spacing:.34em;color:var(--red2)}
.sbanner .no{font-family:var(--bb);font-size:44px;line-height:1;color:#fff;text-shadow:0 0 18px rgba(214,32,63,.5)}
.sbanner .t{font-family:var(--sm);font-size:22px;color:#fff;line-height:1.1}
.sbanner.clear .t{font-size:16px;color:var(--silver)}
.sbanner.clear .k{color:#F2C96F;font-size:26px;letter-spacing:.2em;text-shadow:0 0 14px rgba(242,201,111,.5)}
.sbanner .s{font-size:11px;color:var(--silver);letter-spacing:.06em;margin-top:2px}
.sbanner .vs{display:flex;align-items:center;gap:8px;font-family:var(--bb);font-size:16px;font-style:italic;color:var(--red);margin-top:2px}
.sbanner .vs i{width:36px;height:1px;background:rgba(255,255,255,.3)}
@keyframes sbin{0%{opacity:0;transform:translateX(-30px)}100%{opacity:1;transform:translateX(0)}}
@keyframes sbout{0%{opacity:1;transform:translateX(0)}100%{opacity:0;transform:translateX(30px)}}

/* ---------- 도감 ---------- */
.hero-card.locked{background:#0d0c11}
.hero-card.locked .sil{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--bb);font-size:64px;color:rgba(255,255,255,.08);background:radial-gradient(ellipse at 50% 30%,rgba(120,100,160,.18),transparent 60%)}

.hero-detail .lore{padding:8px 12px 2px;font-size:11px;color:var(--silver);display:flex;flex-direction:column;gap:3px}

.hero-detail .skrow .sk.ps{box-shadow:inset 0 0 0 1px #B48CFF,0 0 8px rgba(180,140,255,.4)}
.hero-detail .nm .own{color:var(--ally1);margin-left:6px}
.hero-detail .syns{display:flex;flex-direction:column;gap:6px;padding:6px 12px 4px}
/* v3.5 도감 개편: 도감 번호 · 수집률 · 컷 갤러리 */
.codex-rate{flex:none;margin-bottom:6px;padding:7px 10px;background:rgba(255,255,255,.05);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}

.codex-rate .bar{height:5px;margin-top:5px;background:rgba(255,255,255,.1)}
.codex-rate .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--red),#F2C96F)}
.codex-grid .hero-card .cno{position:absolute;left:6px;top:6px;z-index:1;font-family:var(--bb);font-size:13px;letter-spacing:.06em;padding:0 5px;height:17px;line-height:18px;color:#F2C96F;background:rgba(12,11,15,.72);box-shadow:inset 0 0 0 1px rgba(242,201,111,.45)}
.codex-grid .hero-card.locked .cno{color:var(--muted);box-shadow:inset 0 0 0 1px rgba(255,255,255,.15)}
.hero-detail .hd.gal{height:190px;background:radial-gradient(ellipse at 50% 40%,rgba(120,100,160,.16),#0d0c11 70%)}
.hero-detail .hd .gv{position:absolute;inset:0}
.hero-detail .hd.alt .gv img{object-fit:contain;object-position:center}
.hero-detail .hd.alt .shade{background:linear-gradient(180deg,rgba(18,16,22,0) 55%,rgba(18,16,22,.95))}
.hero-detail .hd .hd-rig{position:relative;height:100%;aspect-ratio:3/4;margin:0 auto}

.hero-detail .gcnt{position:absolute;right:10px;top:8px;z-index:2;font-family:var(--bb);font-size:12px;color:var(--silver);letter-spacing:.08em}
.hero-detail .gtabs{display:flex;gap:4px;padding:6px 12px 0;overflow-x:auto;scrollbar-width:none}
.hero-detail .gtabs::-webkit-scrollbar{display:none}
.hero-detail .gtabs button{flex:none;padding:3px 8px;font-size:10.5px;color:var(--muted);background:rgba(255,255,255,.05);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.hero-detail .gtabs button.on{color:#fff;box-shadow:inset 0 0 0 1px #F2C96F;background:rgba(242,201,111,.1)}
.synrow{padding:7px 9px;background:rgba(255,255,255,.05);box-shadow:inset 0 0 0 1px rgba(255,255,255,.1);border-left:3px solid var(--muted)}

.synrow .nm{font-size:11.5px;color:#F2C96F;margin-top:2px}
.synrow .nm em{font-style:normal;font-family:var(--bb);font-size:10px;color:var(--silver);margin-left:4px}
.synrow.on .nm em{color:#F2C96F}
.synrow .ds{font-size:10.5px;color:var(--silver);margin-top:2px}
/* 패시브 발동 표시 */
.pfx{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);z-index:7;padding:2px 7px;font-family:var(--sm);font-size:11px;color:#fff;background:rgba(60,30,110,.85);box-shadow:inset 0 0 0 1px #B48CFF;white-space:nowrap;pointer-events:none;animation:pfx calc(900ms / var(--rate)) ease-out both}
@keyframes pfx{0%{opacity:0;transform:translate(-50%,-30%) scale(.8)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.05)}75%{opacity:1}100%{opacity:0;transform:translate(-50%,-90%)}}

.lobby-actions .btn.ghost{grid-column:auto}

/* ---- v3.0 에이르(흰·하늘) 색 변형: 로비 성표 빛 + 특수 컷인 ---- */
.wglow.w-eir{background:radial-gradient(circle,rgba(240,250,255,.6),rgba(160,212,255,.22) 45%,rgba(160,212,255,0) 70%)}
.cutin.gold.c-eir .glow{background:radial-gradient(ellipse at 51% 58%,rgba(200,232,255,.38),rgba(200,232,255,0) 45%),radial-gradient(ellipse at 88% 70%,rgba(40,80,140,.45),rgba(40,80,140,0) 50%)}
.cutin.gold.c-eir .burst{background:radial-gradient(circle,rgba(255,255,255,1) 0%,rgba(215,238,255,.85) 14%,rgba(150,205,255,.35) 34%,rgba(150,205,255,0) 62%)}
.cutin.gold.c-eir .rays{background:repeating-conic-gradient(from 0deg,rgba(215,238,255,.55) 0deg 4deg,rgba(215,238,255,0) 4deg 18deg)}
.cutin.gold.c-eir .spark{box-shadow:0 0 12px 6px rgba(200,232,255,.9)}
.cutin.gold.c-eir .flashw{background:radial-gradient(circle at 51% 58%,rgba(245,252,255,.9),rgba(215,238,255,.28) 18%,rgba(215,238,255,0) 38%)}
