.cutin.gold.c-eir .burst{width:210px;height:210px}
.cutin.gold.c-eir .rays{-webkit-mask-image:radial-gradient(circle,#000 0%,rgba(0,0,0,.55) 30%,transparent 58%),linear-gradient(180deg,transparent 0%,transparent 26%,#000 46%);mask-image:radial-gradient(circle,#000 0%,rgba(0,0,0,.55) 30%,transparent 58%),linear-gradient(180deg,transparent 0%,transparent 26%,#000 46%);-webkit-mask-composite:source-in;mask-composite:intersect}
/* v3.0 부상(HP 30% 미만) 상태에서 피격: 일러스트 교체 없이 움찔 모션 */
.card.wounded.hit .art{animation:hitw calc(460ms / var(--rate)) ease-out}
@keyframes hitw{0%{transform:none}14%{transform:translate(-5px,3px) scale(.965) rotate(-1.4deg)}32%{transform:translate(4px,-1px) scale(.985) rotate(.6deg)}52%{transform:translate(-2px,1px)}74%{transform:translate(1px,0)}100%{transform:none}}
/* v3.1 리아나(주황) 색 변형: 로비 문양 빛 + 특수 컷인 */
.wglow.w-riana{background:radial-gradient(circle,rgba(255,214,160,.62),rgba(255,140,50,.22) 45%,rgba(255,140,50,0) 70%)}
.cutin.gold.c-riana .glow{background:radial-gradient(ellipse at 60% 45%,rgba(255,150,60,.42),rgba(255,150,60,0) 55%),radial-gradient(ellipse at 12% 80%,rgba(150,40,20,.5),rgba(150,40,20,0) 50%)}
.cutin.gold.c-riana .burst{background:radial-gradient(circle,rgba(255,250,235,1) 0%,rgba(255,190,110,.85) 14%,rgba(255,130,40,.38) 34%,rgba(255,130,40,0) 62%)}
.cutin.gold.c-riana .rays{background:repeating-conic-gradient(from 0deg,rgba(255,180,100,.55) 0deg 4deg,rgba(255,180,100,0) 4deg 18deg)}
.cutin.gold.c-riana .spark{box-shadow:0 0 12px 6px rgba(255,170,90,.9)}
.cutin.gold.c-riana .flashw{background:radial-gradient(circle at 70% 55%,rgba(255,240,220,.95),rgba(255,190,120,.35) 40%,rgba(255,190,120,0) 75%)}
.cutin.gold.c-riana .band:after,.cutin.gold.c-riana .band:before{background:#FF8A3D}
.cutin.gold.c-riana .copy small{color:#FF8A3D}
.cutin.gold.c-riana .copy strong{text-shadow:0 0 18px rgba(255,138,61,.7)}
.cutin.gold.c-eir .band:after,.cutin.gold.c-eir .band:before{background:#A8D8FF}
.cutin.gold.c-eir .copy small{color:#A8D8FF}
.cutin.gold.c-eir .copy strong{text-shadow:0 0 18px rgba(168,216,255,.7)}
/* v3.2 클레아(남색·은색) 색 변형: 로비 빛 + 특수 컷인 */
.wglow.w-clea{background:radial-gradient(circle,rgba(236,240,255,.6),rgba(150,170,230,.22) 45%,rgba(150,170,230,0) 70%)}
.cutin.gold.c-clea .glow{background:radial-gradient(ellipse at 50% 40%,rgba(210,220,255,.36),rgba(210,220,255,0) 55%),radial-gradient(ellipse at 12% 80%,rgba(30,40,110,.55),rgba(30,40,110,0) 50%)}
.cutin.gold.c-clea .burst{background:radial-gradient(circle,rgba(255,255,255,1) 0%,rgba(222,230,255,.85) 14%,rgba(120,140,220,.38) 34%,rgba(120,140,220,0) 62%)}
.cutin.gold.c-clea .rays{background:repeating-conic-gradient(from 0deg,rgba(220,228,255,.55) 0deg 4deg,rgba(220,228,255,0) 4deg 18deg)}
.cutin.gold.c-clea .spark{box-shadow:0 0 12px 6px rgba(210,220,255,.9)}
.cutin.gold.c-clea .flashw{background:radial-gradient(circle at 50% 40%,rgba(245,248,255,.95),rgba(200,212,255,.35) 40%,rgba(200,212,255,0) 75%)}
.cutin.gold.c-clea .band:after,.cutin.gold.c-clea .band:before{background:#C9D3F2}
.cutin.gold.c-clea .copy small{color:#C9D3F2}
.cutin.gold.c-clea .copy strong{text-shadow:0 0 18px rgba(120,140,220,.75)}
/* v3.2 아렌(다크 레드·호박) 색 변형: 로비 빛 + 특수 컷인 (진은 기본 금색 그대로) */
.wglow.w-aren{background:radial-gradient(circle,rgba(255,214,150,.6),rgba(230,90,50,.22) 45%,rgba(230,90,50,0) 70%)}
.cutin.gold.c-aren .glow{background:radial-gradient(ellipse at 50% 30%,rgba(255,120,60,.42),rgba(255,120,60,0) 55%),radial-gradient(ellipse at 12% 80%,rgba(120,20,20,.55),rgba(120,20,20,0) 50%)}
.cutin.gold.c-aren .burst{background:radial-gradient(circle,rgba(255,248,230,1) 0%,rgba(255,196,110,.85) 14%,rgba(230,70,40,.4) 34%,rgba(230,70,40,0) 62%)}
.cutin.gold.c-aren .rays{background:repeating-conic-gradient(from 0deg,rgba(255,170,100,.55) 0deg 4deg,rgba(255,170,100,0) 4deg 18deg)}
.cutin.gold.c-aren .spark{box-shadow:0 0 12px 6px rgba(255,140,80,.9)}
.cutin.gold.c-aren .flashw{background:radial-gradient(circle at 50% 35%,rgba(255,240,220,.95),rgba(255,160,100,.35) 40%,rgba(255,160,100,0) 75%)}
.cutin.gold.c-aren .band:after,.cutin.gold.c-aren .band:before{background:#FF6B4A}
.cutin.gold.c-aren .copy small{color:#FF8A5C}
.cutin.gold.c-aren .copy strong{text-shadow:0 0 18px rgba(255,90,60,.75)}


/* ===== v3.3 ===== */
/* 메인 HP바: 사선 대칭(데칼코마니) — 적 = 좌상·우하 컷 / 아군 = 좌하·우상 컷. rotate 없이 clip-path로 틀(.clip)을 자르고, 채움·감소·회복 조각도 같은 기울기로 잘라 틀 밖으로 나가지 않음 */
.bar.hp{--cut:6px;background:none}
.bar.hp .clip{position:absolute;inset:0;background:rgba(255,255,255,.1);overflow:hidden}
.bar.ally.hp .clip{clip-path:polygon(0 0,calc(100% - var(--cut)) 0,100% 100%,var(--cut) 100%)}
.bar.enemy.hp .clip{clip-path:polygon(var(--cut) 0,100% 0,calc(100% - var(--cut)) 100%,0 100%)}
.bar.ally.hp .fill{clip-path:polygon(0 0,calc(100% - var(--cut)) 0,100% 100%,0 100%)}
.bar.enemy.hp .fill{clip-path:polygon(var(--cut) 0,100% 0,100% 100%,0 100%)}
.bar.ally.hp .gain,.bar.ally.hp .lost{clip-path:polygon(0 0,calc(100% - var(--cut)) 0,100% 100%,var(--cut) 100%)}
.bar.enemy.hp .gain,.bar.enemy.hp .lost{clip-path:polygon(var(--cut) 0,100% 0,calc(100% - var(--cut)) 100%,0 100%)}
.bar.hp .lost{top:0;bottom:0;border-radius:0;box-shadow:none;animation-name:lostfade}
.bar.hp .gain{animation:none}
@keyframes lostfade{0%{opacity:1;filter:brightness(1.9)}30%{opacity:.95;filter:brightness(1.25)}100%{opacity:0;filter:brightness(1)}}
/* VS 양옆: 두 바의 안쪽 사선과 같은 기울기의 짧은 선 → 바와 VS가 이어져 보이게 */
.hud .vs{position:relative}
.hud .vs:before,.hud .vs:after{content:'';position:absolute;bottom:-4px;width:1.5px;height:9px;background:rgba(214,32,63,.6)}
.hud .vs:before{left:-4px;transform:skewX(34deg)}
.hud .vs:after{right:-4px;transform:skewX(-34deg)}
.cutin .mult{text-shadow:0 1px 3px rgba(0,0,0,.95),0 0 10px rgba(0,0,0,.7)}
/* 카드: 보호막 칸(HP 뒤에 흰 막) + 도발 중 테두리 */
.card .bar .shd{left:0;width:0;background:linear-gradient(180deg,rgba(240,246,255,.95),rgba(170,205,255,.8));box-shadow:0 0 6px rgba(190,220,255,.85);z-index:1;transition:width calc(200ms / var(--rate)),left calc(200ms / var(--rate))}
.card.taunt{box-shadow:inset 0 0 0 1.5px rgba(201,211,242,.95),0 0 12px rgba(150,170,240,.6)}
.card.taunt .shade{background:linear-gradient(180deg,rgba(150,170,240,.22),rgba(0,0,0,0) 28%,rgba(0,0,0,.2) 55%,rgba(0,0,0,.92))}
/* 버프 칩 종류 추가 */
.bc.up.dr{--bcc:#9CC2FF}.bc.up.shield{--bcc:#E6EEFF}.bc.up.regen{--bcc:#7FCDB0}.bc.up.taunt{--bcc:#C9D3F2}
.bc.st.vuln{--bcc:#D6203F}.bc.st.mark{--bcc:#FF8A3D}
/* 이펙트: 보호막(빛의 벽) · 급소 표식 · 빈틈 · 도발 · 수호 · 지속 회복 */
.fx-barrier{--fxc:#E6EEFF}
.fx-barrier .wall{position:absolute;inset:5% 7%;border:2px solid rgba(230,238,255,.95);border-radius:5px;box-shadow:0 0 12px rgba(190,215,255,.9),inset 0 0 14px rgba(190,215,255,.55);background:linear-gradient(180deg,rgba(215,228,255,.28),rgba(215,228,255,.04));animation:fxwall calc(820ms / var(--rate)) ease-out both}
@keyframes fxwall{0%{opacity:0;transform:scale(1.14)}30%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(.98)}}
.fx-mark{--fxc:#FF9A4D}
.fx-mark .cross{position:absolute;left:50%;top:42%;width:34px;height:34px;margin:-17px 0 0 -17px;border:2px solid #FF9A4D;border-radius:50%;box-shadow:0 0 10px rgba(255,140,60,.9);animation:fxmark calc(820ms / var(--rate)) ease-out both}
.fx-mark .cross:before,.fx-mark .cross:after{content:'';position:absolute;left:50%;top:50%;background:#FF9A4D}
.fx-mark .cross:before{width:2px;height:48px;margin:-24px 0 0 -1px}
.fx-mark .cross:after{width:48px;height:2px;margin:-1px 0 0 -24px}
@keyframes fxmark{0%{opacity:0;transform:scale(1.8) rotate(-45deg)}35%{opacity:1;transform:scale(1) rotate(0)}75%{opacity:1}100%{opacity:0;transform:scale(.9)}}
.fx-crack{--fxc:#FF6A7C}
.fx-crack .crack{position:absolute;left:50%;top:44%;width:26px;height:40px;margin:-20px 0 0 -13px;background:#FFD1D8;clip-path:polygon(55% 0,20% 52%,48% 50%,30% 100%,80% 42%,52% 44%,70% 0);filter:drop-shadow(0 0 6px rgba(255,80,100,.9));animation:fxmark calc(760ms / var(--rate)) ease-out both}
.fx-taunt{--fxc:#C9D3F2}
.fx-taunt .ring{position:absolute;left:50%;top:48%;width:60px;height:60px;margin:-30px 0 0 -30px;border:2px solid rgba(201,211,242,.95);border-radius:50%;box-shadow:0 0 12px rgba(150,170,240,.9);animation:fxring calc(820ms / var(--rate)) ease-out both}
.fx-taunt .ring.r2{animation-delay:calc(160ms / var(--rate))}
@keyframes fxring{0%{opacity:0;transform:scale(.3)}30%{opacity:1}100%{opacity:0;transform:scale(1.7)}}
.fx-guard .gs{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 55%,rgba(225,232,255,.55),rgba(225,232,255,0) 65%);animation:fxglow calc(520ms / var(--rate)) ease-out both}
.fx-regen .p{position:absolute;left:35%;bottom:15%;width:4px;height:4px;border-radius:50%;background:#BFF5DD;box-shadow:0 0 6px 2px rgba(127,205,176,.8);opacity:0;animation:fxrise2 calc(760ms / var(--rate)) ease-out both}
.fx-regen .p3{left:65%;animation-delay:calc(140ms / var(--rate))}
.dmg.shd{font-size:16px;color:#DCE9FF;text-shadow:0 0 6px rgba(150,190,255,.9),0 2px 3px #000}
.dmg.shd small{color:#A9C8FF}
.dmg.guard{font-size:17px;color:#E3E8F7}
.dmg.guard small{color:#C9D3F2}
/* 도감 상세: 수치 설명 목록 */
.hero-detail .skrow{align-items:start}
.hero-detail ul.skd{list-style:none;margin:2px 0 0;padding:0;display:flex;flex-direction:column;gap:2px}
.hero-detail ul.skd li{position:relative;padding-left:9px;line-height:1.45}
.hero-detail ul.skd li:before{content:'';position:absolute;left:1px;top:.62em;width:3px;height:3px;background:var(--red2);transform:rotate(45deg)}
.hero-detail .skd b,.hero-detail .sknote b{font-weight:400;font-family:var(--bb);color:#F2C96F;letter-spacing:.02em}
.hero-detail .sknote{font-size:10px;color:var(--muted);padding:0 0 0 38px;line-height:1.4}
.hero-detail .calc{font-size:9.5px;color:var(--muted);padding:8px 12px 12px;line-height:1.5}
.synrow .nm{font-family:var(--sm);font-size:13px;margin:0}
.synrow .who{font-family:var(--body);font-size:11px;color:#fff;margin-top:2px}
.synrow .who small{font-size:9.5px}
.synrow .ln{font-size:10.5px;color:var(--silver);margin-top:3px;line-height:1.45;display:grid;grid-template-columns:58px 1fr;gap:4px}
.synrow .ln .k{color:var(--muted);font-size:9.5px}
.synrow.lock .nm{color:var(--muted)}
/* 편성 화면: 활성 파티 시너지 */
.syn-now{padding:7px 10px;background:rgba(255,255,255,.04);box-shadow:inset 0 0 0 1px rgba(255,255,255,.1);display:flex;flex-direction:column;gap:3px;flex:none}
.syn-now .h{font-family:var(--sm);font-size:12px;color:#F2C96F}
.syn-now .on{font-size:12px;color:#fff}
.syn-now .on small,.syn-now .off small{font-size:9.5px;color:var(--muted);margin-left:4px}
.syn-now .off{font-size:11px;color:var(--muted)}
.syn-now .none{font-size:11px;color:var(--muted)}
.sbanner .syn{font-size:11px;color:#F2C96F;margin-top:3px;letter-spacing:.02em}


/* ===== v3.4 저장 경고 ===== */
.cloud[data-s="off"]{color:#ff8f8f;font-size:11px;font-weight:600;animation:breathe 1.6s ease-in-out infinite}

/* ===== v3.6 도감 아이콘 그리드 ===== */
.cx-tabs{flex:none;display:flex;gap:4px}
.cx-tabs button{flex:1 1 0;min-width:0;height:30px;display:flex;align-items:center;justify-content:center;gap:4px;white-space:nowrap;font-family:var(--sm);font-size:13px;color:var(--silver);background:rgba(255,255,255,.05);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.cx-tabs button.on{color:#fff;background:rgba(255,255,255,.08);box-shadow:inset 0 -2px 0 var(--red),inset 0 0 0 1px rgba(255,255,255,.2)}
.cx-tabs button.off{color:var(--muted);opacity:.6}
.cx-tabs small{font-family:var(--body);font-size:9px}
.cx-list{flex:1 1 auto;min-height:0;overflow:auto;scrollbar-width:none;display:flex;flex-direction:column;gap:6px}
.cx-list::-webkit-scrollbar{display:none}
.cx-sec{padding:6px 8px;border-left:3px solid var(--red);background:rgba(255,255,255,.04)}
.cx-sec .t{display:flex;align-items:baseline;gap:5px;font-family:var(--sm);font-size:13px;color:#fff}
.cx-sec .t b{margin-left:4px;font-family:var(--bb);font-weight:400;font-size:16px}
.cx-sec .t i{font-style:normal;font-family:var(--bb);font-size:12px;color:var(--muted)}
.cx-sec .t em{margin-left:auto;font-style:normal;font-family:var(--bb);font-size:16px;color:#F2C96F}
.cx-sec .bar{height:4px;margin-top:4px;background:rgba(255,255,255,.1)}
.cx-sec .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--red),#F2C96F)}
.cx-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.cx-ic{position:relative;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px}
.cx-ic .fc{position:relative;width:100%;aspect-ratio:1;overflow:hidden;display:grid;place-items:center;background:#121016}
.cx-ic .fc:after{content:'';position:absolute;inset:0;box-shadow:inset 0 0 0 1px rgba(255,255,255,.2)}
.cx-ic .fc img{position:absolute;left:50%;top:-2%;width:190%;max-width:none;transform:translateX(-50%)}
.cx-ic .no{position:absolute;left:2px;top:2px;z-index:1;padding:2px 3px;font-family:var(--bb);font-size:9px;line-height:1;color:#F2C96F;background:rgba(12,11,15,.75)}
.cx-ic .n{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:10px;color:var(--silver)}
.cx-ic.locked .fc{background:radial-gradient(ellipse at 50% 40%,rgba(120,100,160,.18),#0d0c11 70%)}
.cx-ic.locked .fc b{font-family:var(--bb);font-weight:400;font-size:28px;color:rgba(255,255,255,.18)}
.cx-ic.locked .no,.cx-ic.locked .n{color:var(--muted)}

/* ===== v3.6 캐릭터 창 ===== */
.chv .chd{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;background:rgba(18,16,22,.6);box-shadow:inset 0 0 0 1px var(--line)}
.chv .hd.gal{flex:none;height:270px;touch-action:pan-y}
.chv .hd .gv img{object-fit:contain;object-position:center}
.chv .hd .shade{background:linear-gradient(180deg,rgba(18,16,22,0) 60%,rgba(18,16,22,.95))}
.chv .hd .nm{z-index:1}
.chv .ch-back{position:absolute;left:6px;top:6px;z-index:2;height:24px;padding:0 9px;font-family:var(--sm);font-size:12px;color:#fff;background:rgba(12,11,15,.6);box-shadow:inset 0 0 0 1px rgba(255,255,255,.2)}
.chv .ch-tabs{flex:none;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.chv .ch-tabs button{height:30px;white-space:nowrap;font-size:11.5px;color:var(--muted)}
.chv .ch-tabs button.on{color:#fff;background:rgba(255,255,255,.05);box-shadow:inset 0 -2px 0 var(--red)}
.chv .ch-body{flex:1 1 auto;min-height:0;overflow:auto;scrollbar-width:none;padding-bottom:6px}
.chv .ch-body::-webkit-scrollbar{display:none}
.chv .ch-cuts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;padding:10px 12px}
.chv .ch-cuts button{display:flex;flex-direction:column;align-items:center;gap:3px}
.chv .ch-cuts .ct{position:relative;width:100%;aspect-ratio:1;overflow:hidden;background:#0d0c11}
.chv .ch-cuts .ct:after{content:'';position:absolute;inset:0;box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
.chv .ch-cuts button.on .ct:after{box-shadow:inset 0 0 0 2px #F2C96F}
.chv .ch-cuts .ct img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 15%}
.chv .ch-cuts .l{font-size:10.5px;color:var(--silver)}
.chv .ch-cuts button.on .l{color:#fff}
.chv .ch-thumbs{flex:none;position:relative;display:flex;gap:6px;padding:2px;overflow-x:auto;scrollbar-width:none}
.chv .ch-thumbs::-webkit-scrollbar{display:none}
.chv .ch-thumbs button{flex:none;position:relative;width:52px;height:52px;overflow:hidden;background:#121016;opacity:.55}
.chv .ch-thumbs button:first-child{margin-left:auto}.chv .ch-thumbs button:last-child{margin-right:auto}
.chv .ch-thumbs button img{position:absolute;left:50%;top:-2%;width:190%;max-width:none;transform:translateX(-50%)}
.chv .ch-thumbs button:after{content:'';position:absolute;inset:0;box-shadow:inset 0 0 0 1px rgba(255,255,255,.2)}
.chv .ch-thumbs button.on{opacity:1}
.chv .ch-thumbs button.on:after{box-shadow:inset 0 0 0 2px #F2C96F}

/* ===== v3.7 캐릭터 창 다듬기: 큰 컷 폭 100% 채움 + 이름 줄 가독성 ===== */
.chv .hd .gv>img,.chv .hd.alt .gv>img{object-fit:cover;object-position:center 12%}
.chv .hd .hd-rig{width:100%;height:auto;margin:0}
.chv .hd .shade,.chv .hd.alt .shade{background:linear-gradient(180deg,rgba(12,11,15,.45) 0%,rgba(12,11,15,0) 18%,rgba(12,11,15,0) 42%,rgba(12,11,15,.72) 70%,rgba(12,11,15,.97))}
.chv .hd .nm{right:12px;text-shadow:0 1px 2px rgba(0,0,0,.95),0 0 8px rgba(0,0,0,.8)}
.chv .hd .gcnt{text-shadow:0 1px 2px rgba(0,0,0,.9)}

/* ===== v3.8 전투력 표시 (편성·모험·전투) — 초록 유리 / 노랑 비슷 / 빨강 불리 ===== */
:root{--pw-up:#7FCDB0;--pw-even:#F2C96F;--pw-down:#F04A63}
.topbar .turn.pw b{color:#F2C96F}
.pw-cmp{flex:none;display:flex;align-items:baseline;gap:6px;padding:6px 10px;background:var(--panel);border:1px solid var(--line);font-family:var(--bb);font-size:13px;line-height:1;color:var(--silver);white-space:nowrap;min-width:0}
.pw-cmp .k{font-size:11px;color:var(--muted);margin-right:auto;overflow:hidden;text-overflow:ellipsis}
.pw-cmp b{font-weight:400;font-size:16px;color:#fff}
.pw-cmp .vs{color:var(--muted)}
.pw-cmp.up .me b,.stage-row .pw.up b,.pw-bt.up .a b{color:var(--pw-up)}
.pw-cmp.even .me b,.stage-row .pw.even b,.pw-bt.even .a b{color:var(--pw-even)}
.pw-cmp.down .me b,.stage-row .pw.down b,.pw-bt.down .a b{color:var(--pw-down)}
.pw-cmp.up{border-left:2px solid var(--pw-up)}.pw-cmp.even{border-left:2px solid var(--pw-even)}.pw-cmp.down{border-left:2px solid var(--pw-down)}
.stage-row .pw{font-size:10px;color:var(--muted);margin-top:2px;font-family:var(--bb);letter-spacing:.02em}
.stage-row .pw b{font-weight:400;font-size:12px}
.pw-bt{position:absolute;left:4px;top:4px;z-index:400;pointer-events:none;padding:3px 6px;background:rgba(12,11,15,.72);border-left:2px solid var(--muted);font-family:var(--bb);font-size:10px;line-height:1.25;color:var(--silver);white-space:nowrap}
.pw-bt span{display:block;font-size:9px;color:var(--muted)}
.pw-bt b{font-weight:400;font-size:12px;color:#fff}
.pw-bt.up{border-left-color:var(--pw-up)}.pw-bt.even{border-left-color:var(--pw-even)}.pw-bt.down{border-left-color:var(--pw-down)}
.pw-bt .e b{color:#F04A63}

/* ===== v4.0 전투 화면: 유닛별 전투력(v3.9)·아레나 박스(v3.8 .pw-bt) 제거 → HUD ALLY/ENEMY 옆 팀 합계만 ===== */
.hud .lab .k{white-space:nowrap}
.hud .lab .k .tpw{font-style:normal;font-size:11px;letter-spacing:.02em;color:#F2C96F}
.hud .lab .v{min-width:0;overflow:hidden;text-overflow:ellipsis}

/* ===== v4.0 컷 뷰어 (캐릭터 창 「컷 보기」) ===== */
.cutv{position:absolute;inset:0;z-index:36;display:flex;flex-direction:column;background:rgba(8,7,10,.97)}
.cutv .cv-top{flex:none;display:flex;align-items:center;gap:8px;height:40px;padding:0 8px 0 12px;border-bottom:1px solid var(--line)}
.cutv .cv-l{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--sm);font-size:15px;color:#fff}
.cutv .cv-c{flex:none;font-family:var(--bb);font-size:13px;color:#F2C96F}
.cutv .cv-x{flex:none;height:28px;padding:0 10px;font-family:var(--sm);font-size:13px;color:#fff;background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 1px rgba(255,255,255,.25)}
.cutv .cv-st{flex:1 1 auto;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:pan-y}
.cutv .cv-st>img{width:100%;height:100%;object-fit:contain;-webkit-user-drag:none;pointer-events:none}
.cutv .cv-rig{width:100%;aspect-ratio:3/4;pointer-events:none} /* #app 390×624 고정 → 390×520, 무대(약 540px) 안에 들어감 */
.cutv .cv-rig img{position:absolute;object-fit:contain}
.cutv .cv-rig .rl.body{left:0;top:0;width:100%;height:100%}
.cutv .cv-nav{position:absolute;top:50%;z-index:2;width:34px;height:52px;margin-top:-26px;font-size:28px;line-height:1;color:#fff;background:rgba(12,11,15,.6);box-shadow:inset 0 0 0 1px rgba(255,255,255,.2)}
.cutv .cv-nav.p{left:6px}.cutv .cv-nav.n{right:6px}

/* ===== v4.9 스킬 맵 가독성 · 로비 시차 강화 · 터치 이펙트(룬 글자 제거) ===== */
.sk-sum{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 10px;font-size:13px;color:#ffd77a;font-weight:700;flex:0 0 auto}
.sk-sum #sk-next{color:var(--silver);font-weight:400;font-size:12px}
.sk-map .skn.own circle:first-child{filter:drop-shadow(0 0 4px rgba(255,255,255,.55))}
.sk-map .skn.open circle:first-child{filter:drop-shadow(0 0 7px rgba(255,215,122,1))}
.sk-map .skn.dim{opacity:.4}
.sk-map .skn.lock{opacity:.7}
/* 시차: 진 일러스트는 배경 컷에 포함(bgj) → 배경 컷이 ±22px(세로 60%). 프레임·UI 는 고정. 진 외 대표는 배경 ±10, 캐릭터 ±22 */
.screen.lb>.lb-bg{inset:-30px;transform:translate(calc(var(--tx)*-10px),calc(var(--ty)*-6px));transition:transform .3s ease-out}
.screen.lb>.lb-hero{transform:translate(calc(var(--tx)*22px),calc(var(--ty)*13px));transition:transform .3s ease-out}
.screen.lb.bgj>.lb-bg{transform:translate(calc(var(--tx)*-22px),calc(var(--ty)*-13px))}
.screen.lb.bgj>.lb-hero{transform:translate(calc(var(--tx)*-22px),calc(var(--ty)*-13px))}
/* 터치 이펙트: 룬 글자(ᚱ 등)는 안드로이드 기본 폰트에 없어 빈칸/네모로 보임 → 글자 대신 도형(회전 마름모)으로 대체 */
.lb-fx .r2{width:30px;height:30px;border:1.5px solid rgba(255,231,168,.95);box-shadow:0 0 8px rgba(255,210,120,.8);animation:lbdia .7s ease-out both}
@keyframes lbdia{0%{transform:translate(-50%,-50%) rotate(45deg) scale(.4);opacity:0}30%{opacity:1}100%{transform:translate(-50%,-50%) rotate(-45deg) scale(1.4);opacity:0}}
/* ===== v4.10 챕터 보스: 재사용 이미지에 CSS 색조(--tint). 상태 필터(부상·전투불능)와 겹치지 않게 합성 ===== */
.foe.tinted .sprite{filter:var(--tint) drop-shadow(0 0 14px rgba(214,32,63,.3))}
.foe.tinted.wounded .sprite{filter:var(--tint) saturate(.7) brightness(.9) drop-shadow(0 0 12px rgba(214,32,63,.6))}
.foe.tinted.dead .sprite{filter:grayscale(1)}
/* ===== v4.11 스킬 맵 하단 정보 패널 높이 고정 (선택·찍기 시 맵 영역이 흔들리지 않게) ===== */
.sk-info{flex:0 0 auto;box-sizing:border-box;height:124px;min-height:124px;max-height:124px;overflow-y:auto}
.sk-sum{min-height:32px;box-sizing:border-box;white-space:nowrap}
.sk-map{flex:1 1 0;min-height:0}
/* ===== v4.12 삼성 인터넷 대응: 강제 다크모드 방지 · 로비 터치 드래그 시차 · 재화 아이콘 밝게 ===== */
:root,html,body{color-scheme:only light}
.screen.lb{touch-action:none}
.screen.lb .lb-cur .g i{background:radial-gradient(circle at 35% 30%,#fff8d6,#f2c14e 50%,#b57a14);box-shadow:0 0 0 1.5px #7a4d08,0 0 8px rgba(255,210,90,.85);filter:none}
.screen.lb .lb-cur .c i{background:linear-gradient(135deg,#ffffff,#4ea8ff 50%,#3a6bff);box-shadow:0 0 0 1.5px #1c3a8a,0 0 8px rgba(78,168,255,.85);filter:none}
/* ===== v4.13 로비 레이어 분리 시차(진): 배경 10 / 전경 18 / 진 32px, 상하 60% ===== */
.screen.lb.lay>.lb-bg{inset:0;transform:translate3d(calc(var(--tx)*-10px),calc(var(--ty)*-6px),0) scale(1.05);will-change:transform;transition:transform .3s ease-out}
.screen.lb>.lb-jn,.screen.lb>.lb-fg{position:absolute;inset:0;z-index:1;pointer-events:none;will-change:transform;transition:transform .3s ease-out}
.screen.lb>.lb-jn{transform:translate3d(calc(var(--tx)*32px),calc(var(--ty)*19px),0) scale(1.06)}
.screen.lb>.lb-fg{transform:translate3d(calc(var(--tx)*18px),calc(var(--ty)*11px),0) scale(1.06)}
.lb-jn img,.lb-fg img{width:100%;height:100%;object-fit:cover;display:block}
/* ===== v4.16 폴드8 삼성 인터넷: 프로필 사진·재화 아이콘이 어두운 문제 (어두운 판이 위 레이어로 그려지던 stacking 문제 정리) ===== */
/* 어두운 판은 컨테이너(isolate) 맨 뒤(-1), 프레임(2) < 사진·아이콘·글자(4 이상) */
.lb-prof::after,.lb-cur>span::after,.lb-side::after{z-index:-1}
.screen.lb .lb-av{z-index:4;opacity:1;filter:none;mix-blend-mode:normal}
.screen.lb .lb-cur i{z-index:4;display:block;background:none;border:0;border-radius:0;transform:none;box-shadow:none;filter:none;opacity:1;mix-blend-mode:normal}
.screen.lb .lb-cur .g i,.screen.lb .lb-cur .c i{background:none;box-shadow:none;transform:none;filter:none}
.lb-cur i svg{display:block;width:100%;height:100%}
.screen.lb .lb-pt,.screen.lb .lb-pw{z-index:4}
.lb-prof,.lb-cur>span{filter:none;opacity:1;mix-blend-mode:normal;-webkit-backdrop-filter:none;backdrop-filter:none}
/* ===== v4.17 프로필 사진: 얼굴 전용 정사각 img(art/avatar_*) + object-fit:cover. 겹치는 판·filter·blend 없음 ===== */
.screen.lb .lb-av{position:absolute;overflow:hidden}
.lb-av img,.pf-av img,.lb-pick .lp span img{position:relative;z-index:1;display:block;width:100%;height:100%;border-radius:50%;object-fit:cover;filter:none;opacity:1;mix-blend-mode:normal;-webkit-user-drag:none}
.av-bg{display:block;width:100%;height:100%;border-radius:50%}
.pf-av{overflow:hidden;background:#1a1418}
.lb-pick .lp span{overflow:hidden;background:#1a1418}
/* ===== v4.18 장비 1단계: 가방·상세·캐릭터 장비 탭·결과 드랍 ===== */

<script>/* ===== 신흔 사운드 (전부 코드 합성 · 음원 파일 없음) =====
   SFX.play(name, opt) : 효과음 / BGM.play(kind) : 배경음 루프 / 설정 state.snd={sfx,bgm,vol}
   음원 파일이 생기면 이 파일의 해당 함수만 파일 재생으로 바꾸면 됨 */
const SND=(()=>{
 let ac=null,master=null,sfxG=null,bgmG=null,unlocked=false;
 const cfg=()=>(state.snd=state.snd||{sfx:true,bgm:true,vol:.8});
 function ctx(){if(ac)return ac;const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return null;ac=new AC();master=ac.createGain();master.connect(ac.destination);sfxG=ac.createGain();sfxG.connect(master);bgmG=ac.createGain();bgmG.connect(master);apply();return ac;}
 function apply(){if(!ac)return;const c=cfg();master.gain.value=c.vol;sfxG.gain.value=c.sfx?1:0;bgmG.gain.value=c.bgm?.5:0;}
 function unlock(){const a=ctx();if(!a)return;if(a.state==='suspended')a.resume();unlocked=true;}
 // --- 기본 재료 ---
 let noiseBuf=null;function noise(){const a=ctx();if(!noiseBuf){noiseBuf=a.createBuffer(1,a.sampleRate*1,a.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}const s=a.createBufferSource();s.buffer=noiseBuf;return s;}
 function env(g,t,a,d,peak=1,sus=0,rel=0.05){g.gain.cancelScheduledValues(t);g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(peak,0.0002),t+a);g.gain.exponentialRampToValueAtTime(Math.max(sus,0.0002),t+a+d);g.gain.exponentialRampToValueAtTime(0.0001,t+a+d+rel);}
 function tone(type,f0,f1,t,a,d,peak,dest,rel=.05,q=null){const x=ctx();const o=x.createOscillator();o.type=type;o.frequency.setValueAtTime(f0,t);if(f1&&f1!==f0)o.frequency.exponentialRampToValueAtTime(f1,t+a+d);const g=x.createGain();env(g,t,a,d,peak,0,rel);let n=o;if(q){const bp=x.createBiquadFilter();bp.type='bandpass';bp.frequency.value=q;bp.Q.value=4;o.connect(bp);n=bp;}n.connect(g);g.connect(dest||sfxG);o.start(t);o.stop(t+a+d+rel+.05);}
 function burst(t,a,d,peak,type='lowpass',f=1200,f1=null,dest){const x=ctx();const s=noise();const fl=x.createBiquadFilter();fl.type=type;fl.frequency.setValueAtTime(f,t);if(f1)fl.frequency.exponentialRampToValueAtTime(f1,t+a+d);fl.Q.value=1;const g=x.createGain();env(g,t,a,d,peak,0,.04);s.connect(fl);fl.connect(g);g.connect(dest||sfxG);s.start(t);s.stop(t+a+d+.1);}
 // --- 효과음 정의 (name → 함수). det: 캐릭터별 음높이 변주(0~4) ---
 const S={
  hit:(t,o)=>{burst(t,.005,.08,.5,'lowpass',900,300);tone('sine',140,60,t,.005,.09,.5);},
  slash:(t,o)=>{burst(t,.004,.12,.45,'bandpass',2600,800);tone('triangle',420*(1+(o.det||0)*.06),180,t,.004,.08,.25);},
  multi:(t,o)=>{burst(t,.003,.06,.35,'highpass',1800,3000);tone('square',520,260,t,.003,.05,.12);},
  bash:(t,o)=>{burst(t,.006,.16,.7,'lowpass',500,120);tone('sine',90,40,t,.006,.16,.7);},
  weak:(t,o)=>{burst(t,.003,.05,.4,'highpass',3000);tone('sawtooth',900,200,t,.003,.14,.35);burst(t+.03,.003,.08,.3,'bandpass',1500);},
  crit:(t,o)=>{burst(t,.004,.18,.8,'lowpass',1400,200);tone('sine',160,50,t,.004,.2,.9);tone('sine',1760,2200,t+.02,.01,.16,.3);tone('triangle',2637,2637,t+.05,.01,.2,.18);},
  both:(t,o)=>{S.crit(t,o);tone('sawtooth',1200,300,t+.01,.003,.16,.3);},
  heal:(t,o)=>{[523,659,784,1047].forEach((f,i)=>tone('sine',f,f,t+i*.07,.02,.22,.28,null,.25));burst(t,.05,.4,.08,'highpass',5000);},
  buff:(t,o)=>{[392,494,587].forEach((f,i)=>tone('triangle',f,f*1.01,t+i*.05,.04,.3,.2,null,.3));tone('sine',1568,2093,t+.1,.05,.25,.12,null,.3);},
  shield:(t,o)=>{tone('triangle',330,330,t,.03,.35,.25,null,.3);tone('sine',660,660,t+.06,.03,.3,.15,null,.3);burst(t,.02,.3,.06,'bandpass',900);},
  debuff:(t,o)=>{[587,494,392].forEach((f,i)=>tone('sawtooth',f,f*.97,t+i*.06,.02,.22,.12,null,.2,900));tone('sine',220,110,t,.05,.35,.25);},
  cast:(t,o)=>{const k=o.kind||'atk';const base={atk:600,aoe:420,heal:900,buff:760,debuff:320}[k]||600;burst(t,.02,.22,.25,'bandpass',base,base*2.5);tone('sine',base*.5,base*1.5,t,.03,.2,.18);},
  special:(t,o)=>{burst(t,.05,.6,.35,'bandpass',300,3000);tone('sine',220,880,t,.1,.5,.3);[880,1108,1318,1760].forEach((f,i)=>tone('sine',f,f,t+.45+i*.06,.02,.3,.22,null,.4));tone('sine',55,55,t+.5,.02,.6,.6,null,.6);},
  aoe:(t,o)=>{burst(t,.01,.35,.7,'lowpass',2000,150);tone('sine',120,40,t,.01,.3,.8);},
  sweep:(t,o)=>{burst(t,.02,.25,.4,'bandpass',600,4000);},
  win:(t,o)=>{[523,659,784,1047,1319].forEach((f,i)=>{tone('triangle',f,f,t+i*.12,.02,.3,.3,null,.5);tone('sine',f/2,f/2,t+i*.12,.02,.3,.2,null,.5);});burst(t+.6,.05,.5,.12,'highpass',4000);},
  lose:(t,o)=>{[440,415,392,311].forEach((f,i)=>tone('sawtooth',f,f*.98,t+i*.25,.05,.45,.18,null,.5,700));tone('sine',55,40,t,.1,1.2,.35,null,.8);},
  start:(t,o)=>{burst(t,.005,.25,.8,'lowpass',400,80);tone('sine',70,35,t,.005,.4,.8);tone('triangle',880,880,t+.15,.01,.5,.2,null,.6);burst(t+.15,.05,.7,.1,'highpass',3000);},
  next:(t,o)=>{burst(t,.03,.3,.4,'bandpass',400,3500);tone('sine',300,900,t,.05,.25,.2);},
  click:(t,o)=>{tone('square',1200,800,t,.002,.03,.12);burst(t,.002,.02,.15,'highpass',4000);},
  toggle:(t,o)=>{tone('sine',700,1000,t,.005,.06,.2);},
  reward:(t,o)=>{[1319,1760].forEach((f,i)=>tone('sine',f,f,t+i*.09,.005,.25,.3,null,.3));tone('triangle',2637,2637,t+.18,.005,.3,.15,null,.4);},
  levelup:(t,o)=>{[659,784,988,1319].forEach((f,i)=>tone('triangle',f,f,t+i*.08,.01,.35,.3,null,.5));},
  death:(t,o)=>{burst(t,.01,.4,.4,'lowpass',800,100);tone('sine',200,50,t,.02,.5,.4);},
  summon:(t,o)=>{burst(t,.1,.8,.3,'bandpass',200,5000);[440,554,659,880,1108].forEach((f,i)=>tone('sine',f,f,t+.3+i*.08,.02,.5,.2,null,.6));},
 };
 function play(name,opt={}){const c=cfg();if(!c.sfx)return;const a=ctx();if(!a||!S[name])return;if(a.state==='suspended')a.resume();try{S[name](a.currentTime+0.001,opt);}catch(e){}}
 // --- BGM: 챕터 분위기별 코드 진행을 저역 패드 + 아르페지오로 루프 ---
 const MOODS={lobby:{bpm:56,scale:[0,2,3,5,7,8,10],root:220,prog:[0,5,3,4],tri:.06,pad:.11,pulse:0},
  warm:{bpm:76,scale:[0,2,4,5,7,9,11],root:246.9,prog:[0,3,4,0],tri:.07,pad:.1,pulse:.05},
  calm:{bpm:70,scale:[0,2,3,5,7,8,10],root:220,prog:[0,5,3,4],tri:.06,pad:.1,pulse:.04},
  heavy:{bpm:64,scale:[0,2,3,5,7,8,10],root:164.8,prog:[0,0,5,6],tri:.05,pad:.12,pulse:.09},
  bright:{bpm:96,scale:[0,2,4,5,7,9,11],root:261.6,prog:[0,4,5,3],tri:.08,pad:.09,pulse:.06},
  open:{bpm:84,scale:[0,2,4,5,7,9,11],root:196,prog:[0,3,0,4],tri:.07,pad:.1,pulse:.05},
  boss:{bpm:112,scale:[0,1,3,5,7,8,10],root:146.8,prog:[0,6,5,6],tri:.06,pad:.12,pulse:.14}};
 let bgm={kind:null,timer:null,next:0,step:0};
 const f_=(m,deg,oct=0)=>m.root*Math.pow(2,(m.scale[((deg%7)+7)%7]+12*(Math.floor(deg/7)+oct))/12);
 function schedule(){const c=cfg();const m=MOODS[bgm.kind];if(!m||!ac)return;const beat=60/m.bpm;while(bgm.next<ac.currentTime+0.6){const t=bgm.next,st=bgm.step;const bar=Math.floor(st/8)%m.prog.length,deg=m.prog[bar];
   if(st%8===0){[0,2,4].forEach(d=>{tone('triangle',f_(m,deg+d,-1),f_(m,deg+d,-1),t,.6,beat*7,m.pad,bgmG,1.2);});tone('sine',f_(m,deg,-2),f_(m,deg,-2),t,.3,beat*7.5,m.pad*1.1,bgmG,.8);}
   const arp=[0,2,4,7,4,2][st%6];tone('sine',f_(m,deg+arp,1),f_(m,deg+arp,1),t,.01,beat*.5,m.tri,bgmG,.5);
   if(m.pulse&&st%2===0){burst(t,.003,.06,m.pulse,'lowpass',180,60,bgmG);}
   if(m.pulse>.08&&st%4===2){burst(t,.003,.1,m.pulse*.6,'highpass',2500,4000,bgmG);}
   bgm.next+=beat/2;bgm.step++;}
 }
 function playBgm(kind){const c=cfg();if(bgm.kind===kind&&bgm.timer)return;stopBgm();if(!c.bgm)return;const a=ctx();if(!a)return;if(a.state==='suspended')a.resume();bgm.kind=kind;bgm.next=a.currentTime+.05;bgm.step=0;bgm.timer=setInterval(schedule,200);schedule();}
 function stopBgm(){if(bgm.timer)clearInterval(bgm.timer);bgm.timer=null;bgm.kind=null;}
 function set(k,v){const c=cfg();c[k]=v;save();apply();if(k==='bgm'){if(!v)stopBgm();else if(bgm.kind===null&&window.__bgmWant)playBgm(window.__bgmWant);}}
 return {play,bgm:k=>{window.__bgmWant=k;playBgm(k);},stopBgm,unlock,set,cfg};
})();

function mkHero(id,i){const h=HEROES.find(x=>x.id===id),m=lvMult(heroLv(id)),B=skBonus(),E=gearBonus(id),f4=setFour(id); /* 장비 = startBattle 이 정한 콘텐츠(ctxOv) 프리셋 */return {side:'ally',i,id,name:h.name,en:h.en,set4:f4,atk:Math.round(h.atk*m*(1+B.atk+E.atk)),max:Math.round(h.hp*m*(1+B.hp+E.hp)),hp:Math.round(h.hp*m*(1+B.hp+E.hp)),spd:h.spd+B.spd+E.spd+(f4==='spd'?8:0),def:Math.round(h.def*(1+B.hp+E.def+(f4==='def'?.1:0))),ecrit:E.crit,eweak:E.weak,s1:{...h.s1,cdMax:h.s1.cd,cd:0},s2:{...h.s2,cdMax:Math.max(1,h.s2.cd-(f4==='spd'?1:0)),cd:0},art:h.art||null,buffs:[],dmg:0,heal:0,taken:0,maxHit:0};}
function mkFoe(key,i,lv,rm=1){const f=FOES[key],m=1+(lv-1)*.12,h=(rm-1)/2+1;return {side:'enemy',i,key,img:f.img||key,tint:f.tint||'',name:f.name,boss:!!f.boss,atk:Math.round(f.atk*m*rm),max:Math.round(f.hp*m*rm),hp:Math.round(f.hp*m*rm),spd:Math.round(f.spd*h),def:Math.round(f.def*h), // v4.40 rm=레이드 단계 배율(HP·ATK 전체, def·spd 절반 비율) · 일반 스테이지는 1
s1:f.s1?{...f.s1,cdMax:f.s1.cd,cd:1}:null,buffs:[],w:f.w,h:f.h};}
/* v3.8 전투력 (표시 전용 · 전투 계산에는 안 씀) — 아군·적 같은 식
   전투력 = √(공격 기대치 × 생존 기대치) × 10, 파티/적 편성 = 합계 (란체스터식: 합계 비율로 우열 비교)
   공격 기대치 = 공격력 × (1 + 치명·약점 기대 가산) × (1 + 스킬 가산) × 속도/100 · 생존 기대치 = 체력 × (1 + 방어/100)
   스킬 가산 = 스킬마다 (가치 − 1) ÷ 쿨다운, 가치 = 피해 계수×타수(전체 공격 ×2) + 보조 효과 1개당 0.75 · 고유 패시브 보유 ×1.15 (실제 전투 시뮬레이션으로 맞춤, tests/power_check.js) */
function powerOf(u){const hp=u.max||u.hp,crit=u.crit!=null?u.crit:CRIT.chance,weak=u.weak!=null?u.weak:WEAK.chance;
 const skv=sk=>{if(!sk)return 0;let v=0;for(const e of sk.fx)v+=e.t==='dmg'?(e.mult*(e.hits||1)+(e.defMult?e.defMult*u.def/u.atk:0))*(e.to==='all'||e.to==='foes'?2:1):.75;return Math.max(0,v-1)/sk.cd;};
 const off=u.atk*(1+crit*(CRIT.mult-1)+weak*(WEAK.mult-1))*(1+skv(u.s1)+skv(u.s2))*u.spd/100,dur=hp*(1+u.def/100);
 return Math.round(Math.sqrt(off*dur)*10*(u.ps?1.15:1));}
function heroPower(id,cx){const h=HEROES.find(x=>x.id===id);if(!h)return 0;const st=heroStats(h,false,cx),ps=PASSIVE[id];
 return powerOf({atk:st.atk,max:st.hp,def:st.def,spd:st.spd,s1:h.s1,s2:h.s2,crit:st.crit+(ps&&ps.v.crit||0),weak:st.weak+(ps&&ps.v.weak||0),ps:!!ps});}

/* 적 진형: 1 중앙 / 2 좌우 / 3 = 뒤1+앞2 / 4 = 2×2 / 5 = 뒤3+앞2. 수가 많을수록 전체 축소, 보스는 중앙 크게. cx=가로 중심 비율, gy=발 위치(px) */

/* ---------- 전투 로직 ---------- */
const alive=arr=>arr.filter(u=>u.hp>0);
/* 버프 {k,v,t,fresh,bad,src,perm,stk,by} : bad = 해로운 효과(디버프 칸). perm = 전투 끝까지(턴 감소 없음) */
const isBad=x=>!!x.bad||(['atk','def','spd'].includes(x.k)&&x.v<0);
function buffVal(u,k){return u.buffs.filter(b=>b.k===k).reduce((n,b)=>n+b.v,0);}
const hasBuff=(u,k)=>!!u&&u.buffs.some(b=>b.k===k);
/* 같은 출처(src)의 같은 효과는 쌓지 않고 갱신(수치·남은 턴 중 큰 값) */
function addBuff(u,x){if(!u||u.hp<=0)return null;const same=x.src?u.buffs.find(b=>b.k===x.k&&b.src===x.src&&!!b.perm===!!x.perm):null;
 if(same){same.v=x.k==='shield'||x.k==='regen'?Math.max(same.v,x.v):x.v;same.t=Math.max(same.t,x.t);if(x.fresh)same.fresh=true;if(x.by)same.by=x.by;return same;}
 const o={...x};u.buffs.push(o);return o;}
const atkOf=u=>u.atk*Math.max(0,1+buffVal(u,'atk'));
const defOf=u=>u.def*Math.max(0,1+buffVal(u,'def'));
const drOf=u=>Math.min(.6,Math.max(0,buffVal(u,'dr')));
function effSpd(u,b=battle){return u.spd*Math.max(.1,1+buffVal(u,'spd'));}
function critChance(u){const p=passiveOf(u);return CRIT.chance+(u.ecrit||0)+(p&&p.v.crit||0)+buffVal(u,'crit');}
function weakChance(att,tgt,e){const p=passiveOf(att);return WEAK.chance+(att.eweak||0)+(e&&e.weakUp||0)+(p&&p.v.weak||0)+(tgt?Math.max(0,buffVal(tgt,'mark')):0);}
/* 1타 기본 피해 = (공격력×계수 + 방어력×계수) − 대상 방어력×0.8, ±8% */
function calcDamage(att,tgt,e){const raw=atkOf(att)*(e.mult||1)+(e.defMult?defOf(att)*e.defMult:0);return Math.max(1,raw-defOf(tgt)*.8)*rnd(.92,1.08);}
/* 공격자 쪽 배율: 리아나 연계(_amp) × 활성 시너지 */
function outMod(att,tgt,b){let m=1+(att._amp||0);if(att.side==='ally')for(const sy of synOn(b))if(sy.hook&&sy.hook.outMod)m*=sy.hook.outMod(att,tgt,b)||1;return m;}
function pickTarget(att,foes,mode){const a=alive(foes);if(!a.length)return null;
 if(att.side==='enemy'){const tt=a.find(x=>hasBuff(x,'taunt'));if(tt)return tt;} // 도발: 적의 단일 대상 공격은 도발 중인 아군에게
 if(mode==='lowest')return a.reduce((m,x)=>x.hp<m.hp?x:m); // 기본 공격이 약점을 노릴 때: HP가 가장 낮은 대상 (기존 규칙)
 if(att.side==='ally'&&battle&&battle.target!=null){const t=a.find(x=>x.i===battle.target);if(t)return t;}
 if(mode==='weakest')return a.reduce((m,x)=>x.hp/x.max<m.hp/m.max?x:m);
 return a[Math.floor(Math.random()*a.length)];}
/* v4.21 6성 4세트: 맹공 = 스킬 피해 +20% · 생명 = HP 50% 미만일 때 받는 피해 -15% · 수호 = 받는 피해 -12%(방어 +10% 는 mkHero) */
const setMod=(att,tgt,skill)=>{let m=1;if(att.set4==='atk'&&skill)m*=1.2;if(tgt.set4==='hp'&&tgt.hp/tgt.max<.5)m*=.85;if(tgt.set4==='def')m*=.88;return m;};
const durOf=(u,t)=>u.set4==='insight'?Math.max(t,Math.min(3,t+1)):t; // 통찰 4세트: 버프·디버프 +1턴(최대 3)
/* 피해 적용: 보호막이 먼저 흡수 → 남은 만큼 HP */
function applyDamage(u,amount){let left=amount,absorbed=0;for(const s of u.buffs){if(s.k!=='shield'||left<=0)continue;const a=Math.min(s.v,left);s.v-=a;left-=a;absorbed+=a;}
 u.buffs=u.buffs.filter(x=>x.k!=='shield'||x.v>0);const prev=u.hp;u.hp=Math.max(0,u.hp-left);return {absorbed,hp:prev-u.hp,prev};}
/* 회복: 시전자 연계(_amp) × 시너지 회복 배율. 통계에는 실제로 오른 HP만 */
function healUnit(src,t,base,{noAmp=false,fxOn=true,quiet=false}={}){if(!t||t.hp<=0)return 0;let v=base*(noAmp?1:1+(src&&src._amp||0));if(src&&src.set4==='grace')v*=1.2;
 v*=Math.max(0,1+buffVal(t,'heal')); // v4.41 회복 감소 디버프(레이드 생명 7단계)
 if(src&&src.side==='ally')for(const sy of synOn(battle))if(sy.hook&&sy.hook.healMod)v*=sy.hook.healMod(src,t,battle)||1;
 v=Math.round(v);const before=t.hp;t.hp=Math.min(t.max,t.hp+v);const got=t.hp-before;if(src)src.heal=(src.heal||0)+got;
 if(quiet&&got<=0)return 0;popDmg(t,v,'heal');if(fxOn)fx(t,quiet?'regen':'heal');if(t.side==='ally')paintCards();return v;}
function tickRegen(u){for(const x of u.buffs.filter(x=>x.k==='regen'))healUnit(x.by||null,u,x.v,{noAmp:true,quiet:true});}
/* 클레아 「수호의 맹세」: 다른 아군이 맞을 때 대신 받을 수호자와 비율 */
function guardFor(t,b){for(const g of alive(b.allies)){const p=passiveOf(g);if(p&&p.hook&&p.hook.guard){let r=p.hook.guard(g,t,b);if(r>0){for(const sy of synOn(b))if(sy.hook&&sy.hook.shareAdd)r+=sy.hook.shareAdd(g,t,b)||0;return {g,r:Math.min(.9,r)};}}}return null;}
function afterHit(u,res,att){const b=battle;
 if(u.side==='ally'){for(const sy of synOn(b))if(sy.hook&&sy.hook.onHurt)sy.hook.onHurt(u,b);
  if(u.hp>0)for(const h of alive(b.allies)){const p=passiveOf(h);if(p&&p.hook&&p.hook.onAllyLow)p.hook.onAllyLow(h,u,res.prev,b);}}
 if(u.hp<=0&&res.prev>0)onDown(u,att);}
function onDown(u,att){const b=battle;u.buffs=[];if(u.side==='enemy'&&b.target===u.i)b.target=null;SND.play('death');
 if(att&&att.side==='ally'&&u.side==='enemy'){const p=passiveOf(att);if(p&&p.hook&&p.hook.onKill)p.hook.onKill(att,u,b);}
 if(u.side==='ally')for(const sy of (b.syn||[]))if(sy.hook&&sy.hook.onDeath)sy.hook.onDeath(u,b);}
async function hitOne(att,tgt,e,{skill=null,fxk=null,seq=0,weak:wk=null}={}){const b=battle;if(!b||b.done||att.bt!==b||!tgt||tgt.hp<=0)return 0;
 const weak=wk!=null?wk:Math.random()<weakChance(att,tgt,e),crit=Math.random()<critChance(att);
 let dmg=calcDamage(att,tgt,e);if(weak)dmg*=WEAK.mult;if(crit)dmg*=CRIT.mult;
 dmg*=outMod(att,tgt,b);if(e.markUp&&buffVal(tgt,'mark')>0)dmg*=1+e.markUp;dmg*=1+Math.max(0,buffVal(tgt,'vuln'));dmg*=1-drOf(tgt);dmg*=setMod(att,tgt,skill);dmg=Math.max(1,Math.round(dmg));
 // 수호: 아군 피격 시 클레아가 일부를 대신 받음 (클레아 자신의 받는 피해 감소·보호막 적용)

 const grade=crit&&weak?'both':crit?'crit':weak?'weak':'';SND.play(grade||({slash:'slash',slash2:'slash',multi:'multi',bash:'bash',burst:'aoe'}[fxk]||'hit'),{det:att.i});

 const shown=dmg-part-res.absorbed;
 if(grade==='both'){fx(tgt,'crit');fx(tgt,'weak');shake();}else if(grade==='crit'){fx(tgt,'crit');shake();}else if(grade==='weak')fx(tgt,'weak');

 if(part>0){const g=gd.g;const s2=Math.max(0,Math.round(part*(1-drOf(g))));const r2=applyDamage(g,s2);g.taken+=s2;pfx(g,'수호');fx(g,'guard');flashHit(g,'');if(s2-r2.absorbed>0)popDmg(g,s2-r2.absorbed,'guard');if(r2.absorbed>0)popDmg(g,r2.absorbed,'shd',1);paintCards();afterHit(g,r2,att);}

/* ---------- 타격 패턴 실행 (스킬 컨셉별) ----------
 slam: 단일 1회 강타 / combo: 단일 N연타 / bash: 단일 방패 강타
 burst: 전체 동시 1회 / rapid: 전체 각 N연타 / sweep·sweep-r: 좌→우(우→좌) 순차 / random: N회를 매 타 무작위 적에게 */
async function execAttack(u,skill,e,foes){
 const b=battle;const pat=e.pattern||(e.to==='all'?'burst':'slam');const hits=e.hits||1;const hitSet=new Set();
 const ar=$('#arena');const rumble=()=>{if(!ar||!state.fx)return;ar.classList.remove('rumble');void ar.offsetWidth;ar.classList.add('rumble');setTimeout(()=>ar.classList.remove('rumble'),600/rate());};
 const sweepLine=dir=>{if(!ar||!state.fx)return;const sw=el(`<div class="sweep ${dir==='r'?'rev':''}"></div>`);ar.appendChild(sw);setTimeout(()=>sw.remove(),700/rate());};
 const one=async(t,fxk,i=0)=>{if(!t||t.hp<=0)return;hitSet.add(t);await hitOne(u,t,e,{skill,fxk,seq:i});};
 const single=()=>pickTarget(u,foes,e.to==='weakest'?'weakest':null);
 const byX=arr=>[...arr].sort((a,c)=>foePos(battle.foes.length,a.i,a).left-foePos(battle.foes.length,c.i,c).left);
 switch(pat){
  case 'slam':{await one(single(),'slash');break;}
  case 'bash':{await one(single(),'bash');break;}
  case 'combo':{const t=single();for(let i=0;i<hits;i++){if(!t||t.hp<=0)break;await one(t,i%2?'slash2':'slash',i);await sleep(130);}break;}
  case 'burst':{rumble();if(ar&&state.fx){const f=el('<div class="aflash"></div>');ar.appendChild(f);setTimeout(()=>f.remove(),500/rate());}await Promise.all(alive(foes).map(t=>one(t,'burst')));await sleep(420);break;}
  case 'rapid':{rumble();sweepLine('l');SND.play('sweep');for(const t of alive(foes)){for(let i=0;i<hits;i++){if(t.hp<=0)break;await one(t,'multi',i);await sleep(70);}await sleep(40);}break;}
  case 'sweep':case 'sweep-r':{const dir=pat==='sweep'?'l':'r';sweepLine(dir);SND.play('sweep');let list=u.side==='ally'?byX(alive(foes)):alive(foes);if(dir==='r')list=list.reverse();for(let r=0;r<hits;r++){for(const t of list){await one(t,'slash',r);await sleep(110);}}break;}
  case 'random':{rumble();for(let i=0;i<hits;i++){const a=alive(foes);if(!a.length)break;let t=a[Math.floor(Math.random()*a.length)];if(a.length>1&&t===b._lastRnd)t=a[(a.indexOf(t)+1+Math.floor(Math.random()*(a.length-1)))%a.length];b._lastRnd=t;await one(t,'multi',i);await sleep(95);}break;}
  default:{await one(single(),'slash');}
 }
 return [...hitSet];}
/* 스킬 실행: fx 목록을 순서대로 (설명 문장과 같은 데이터) */
async function runSkill(u,skill){const b=battle;const foes=u.side==='ally'?b.foes:b.allies,mates=u.side==='ally'?b.allies:b.foes;let last=[];
 const pick=to=>{const m=alive(mates);switch(to){case 'self':return u.hp>0?[u]:[];case 'allies':return m;case 'foes':case 'all':return alive(foes);case 'lowest':return m.length?[m.reduce((x,y)=>y.hp/y.max<x.hp/x.max?y:x)]:[];case 'same':return last.filter(x=>x.hp>0);default:{const t=pickTarget(u,foes,to==='weakest'?'weakest':null);return t?[t]:[];}}};
 for(const e of skill.fx){if(b.done||battle!==b||u.hp<=0)break;
  switch(e.t){
   case 'dmg':{last=await execAttack(u,skill,e,foes);if(e.killAtk&&u.hp>0){const k=last.filter(t=>t.hp<=0).length;if(k){addBuff(u,{k:'atk',v:e.killAtk*k,t:2,fresh:true,src:skill.name+' 처치'});pfx(u,'ATK ↑');paintAll();}}break;}
   case 'heal':{last=pick(e.to);SND.play('heal');for(const t of last){healUnit(u,t,atkOf(u)*e.mult);const n=unitNode(t);n&&(n.classList.remove('healed'),void n.offsetWidth,n.classList.add('healed'));}paintCards();await sleep(350);break;}
   case 'regen':{last=pick(e.to);for(const t of last){addBuff(t,{k:'regen',v:Math.round(atkOf(u)*e.mult),t:e.turns,fresh:t===u,src:skill.name,by:u});fx(t,'regen');}paintAll();await sleep(160);break;}
   case 'shield':{last=pick(e.to);SND.play('shield');for(const t of last){const amt=Math.round((e.atkMult?atkOf(u)*e.atkMult:e.defMult?defOf(u)*e.defMult:(e.base==='self'?u.max:t.max)*e.pct)*(u.set4==='grace'?1.2:1));addBuff(t,{k:'shield',v:amt,t:e.turns,fresh:t===u,src:skill.name,by:u});fx(t,'barrier','+'+fmt(amt));}paintAll();await sleep(420);break;}
   case 'buff':{last=pick(e.to);SND.play(e.k==='dr'?'shield':'buff');for(const t of last){addBuff(t,{k:e.k,v:e.v*supOf(u),t:durOf(u,e.turns),fresh:t===u,src:skill.name});fx(t,e.k==='dr'||e.k==='def'?'shield':'buff',({atk:'ATK',def:'DEF',spd:'SPD',dr:'GUARD'})[e.k]+(e.k==='dr'?'':' ↑'));}paintAll();await sleep(420);break;}
   case 'debuff':{last=pick(e.to);SND.play('debuff');for(const t of last){addBuff(t,{k:e.k,v:e.v*supOf(u),t:durOf(u,e.turns),bad:true,src:skill.name});fx(t,e.k==='mark'?'mark':'debuff',e.k==='mark'?'MARK':({atk:'ATK',def:'DEF',spd:'SPD'})[e.k]+' ↓');}paintAll();await sleep(420);break;}
   case 'taunt':{last=u.hp>0?[u]:[];addBuff(u,{k:'taunt',v:1,t:e.turns,fresh:true,src:skill.name});SND.play('shield');fx(u,'taunt','TAUNT');paintAll();await sleep(300);break;}
  }}

/* v4.41 레이드 6~7단계 고유 패턴 (기존 버프·보호막·재생·디버프 구조 재사용, 수치는 처음엔 약하게 · T-093 시뮬로 조정)
   u.rp=레이드 종류 · u.rl=단계 · u.rt=보스 자신의 턴 수. rpStart=턴 시작 효과, rpEnd=행동 뒤 추가 행동 */
const RP_DESC={atk:['3턴마다 공격력 +15% 누적(최대 +60%) · HP 50% 이하 광폭(매 턴 추가 타격)','7단계: 2턴 예고 후 전체 강타'],
 hp:['매 턴 최대 HP 2% 재생 · HP 70%에서 1회 대회복','7단계: 아군이 받는 회복량 -30%'],

const RP_STK=4,RP_STK_V=.15;
function rpInit(b){const st=b.stage;if(!st.raid||(st.rs||1)<6)return;for(const f of b.foes){f.rp=st.raid;f.rl=st.rs;f.rt=0;if(f.rp==='def'&&f.rl>=7)addBuff(f,{k:'dr',v:.2,t:1,perm:true,src:'돌갑옷'});}}
async function rpStart(u,b){u.rt++;const n=u.rt,l=u.rl,al=alive(b.allies);
 switch(u.rp){
  case 'atk':{if(n%3===0&&(u.rstk||0)<RP_STK){u.rstk=(u.rstk||0)+1;const o=addBuff(u,{k:'atk',v:RP_STK_V*u.rstk,t:1,perm:true,src:'맹공'});if(o)o.stk=u.rstk;pfx(u,`맹공 ATK +${Math.round(RP_STK_V*u.rstk*100)}%`);}
   if(!u.rage&&u.hp/u.max<=.5){u.rage=1;pfx(u,'광폭 ×2');}
   if(l>=7&&n%4===2)pfx(u,'예고: 전체 강타');break;}
  case 'hp':{healUnit(null,u,u.max*.02,{noAmp:true,quiet:true});
   if(!u.big&&u.hp/u.max<=.7){u.big=1;healUnit(null,u,u.max*.15,{noAmp:true});pfx(u,'대회복');}
   if(l>=7&&n===1){for(const a of al)addBuff(a,{k:'heal',v:-.3,t:1,perm:true,bad:true,src:'뿌리 독'});pfx(u,'회복 -30%');paintAll();}break;}
  case 'def':{if(n%4===0){const v=Math.round(u.max*.15);addBuff(u,{k:'shield',v,t:3,fresh:true,src:'돌갑옷 보호막',by:u});pfx(u,'보호막');}break;}
  case 'grace':{if(n%3===0){healUnit(null,u,u.max*.08,{noAmp:true});const t=al.find(a=>a.buffs.some(x=>!isBad(x)));if(t){const x=t.buffs.find(x=>!isBad(x));t.buffs=t.buffs.filter(y=>y!==x);pfx(t,'버프 소거');}
   if(l>=7){addBuff(u,{k:'shield',v:Math.round(u.max*.10),t:3,fresh:true,src:'빛무리 보호막',by:u});u.buffs=u.buffs.filter(x=>!isBad(x));}pfx(u,l>=7?'회복·보호막':'회복');paintAll();}break;}
  case 'insight':{if(n%3===1){for(const a of al){addBuff(a,{k:'atk',v:-.2,t:3,bad:true,src:'그림자 침식'});addBuff(a,{k:'spd',v:-.15,t:3,bad:true,src:'그림자 침식'});}pfx(u,'ATK·SPD ↓');paintAll();}
   if(l>=7&&n%4===3&&al.length){const t=pickOf(al);addBuff(t,{k:'mark',v:.3,t:2,bad:true,src:'낙인'});pfx(t,'낙인');paintAll();}break;}
 }}
async function rpEnd(u,b){const n=u.rt,l=u.rl,hit=async(mult,t)=>{t=t||pickTarget(u,b.allies,null);if(t&&t.hp>0&&!b.done){await hitOne(u,t,{mult},{});await sleep(150);}};

  case 'atk':{if(u.rage){pfx(u,'광폭');await hit(1);}
   if(l>=7&&n%4===0){pfx(u,'전체 강타!');await runSkill(u,{name:'폭주 강타',cd:0,fx:[{t:'dmg',to:'all',mult:1.2,hits:1,pattern:'burst'}]});}break;}
  case 'spd':{if(n%2===0){pfx(u,'추가 행동');await hit(1);}if(l>=7&&n===1){pfx(u,'선제 연속');await hit(1);await hit(1);}break;}
  case 'insight':{if(l>=7&&n%4===0){const t=alive(b.allies).find(a=>a.buffs.some(x=>x.k==='mark'&&x.src==='낙인'));if(t){pfx(u,'집중 폭발');await hit(1.6,t);}}break;}

/* 스킬 선택(아군): 쿨이 찬 스킬 중 상황 우선순위 — ①힐(아군 HP 70% 미만) ②버프·도발·보호막(효과가 아직 없을 때) ③표식·디버프(적에게 아직 없을 때) ④공격 · 해당 없으면 null(기본 공격). 적은 s1 쿨이 차면 사용
   스킬 데이터 when: needHeal / needBuff / needMark (없으면 공격 스킬). 이미 걸린 효과는 buffs 의 src(스킬 이름)로 판단 */
function chooseSkill(u,b){const s=[u.s1,u.s2].filter(x=>x&&x.cd===0);if(!s.length)return null;if(u.side==='enemy')return s[0];

  ||s.find(k=>k.when==='needBuff'&&lack(k,tgs(k)))
  ||s.find(k=>k.when==='needMark'&&foes.length&&lack(k,foes))

/* 특수스킬 판정: s2 이거나 전용 컷인(cut)이 지정된 스킬. 컷인·아이콘은 슬롯이 아니라 스킬 데이터(cut·icon)에 묶임 */
const isSpecial=(u,sk)=>!!(u.side==='ally'&&sk&&(sk===u.s2||sk.cut));

async function act(u){const b=battle;const foes=u.side==='ally'?b.foes:b.allies;b.acts=(b.acts||0)+1;paintHud();
 // 내 턴 시작: 내 스킬 쿨다운 1 감소 (첫 턴 제외) → 지속 회복 → 연계·약속 받기

 if(!skill){const p0=Math.min(.99,weakChance(u,null,null));let w=Math.random()<p0;const t=pickTarget(u,foes,w?'lowest':null);if(t){if(!w){const m=Math.max(0,buffVal(t,'mark'));if(m>0&&Math.random()<m/(1-p0))w=true;}await hitOne(u,t,{mult:1},{weak:w});}}
 else{skill.cd=skill.cdMax;await runSkill(u,skill);}

 if(u.hp>0){const p=passiveOf(u);if(p&&p.hook&&p.hook.onActEnd)p.hook.onActEnd(u,b);}

}
/* v4.25 사냥 중 계정·진행도가 바뀌면(로그인·로그아웃·클라우드 불러오기) 이전 진행도의 사냥은 새 계정에 적용하지 않고 종료 */
function huntStale(b){if(!b.hunt||b.st0===state)return false;b.done=true;if(battle===b){battle=null;clearResume();paintHunt();}return true;}
/* v4.31 전투 루프 최상위 보호: 예외로 조용히 멈추지 않고 로그+알림 후 다음 라운드로 진행, 반복 오류(8회)면 전투를 강제 종료 */
async function loop(){const b=battle;try{await loop0();}catch(e){logErr('loop',e);if(!b||b.done||battle!==b)return;b.errN=(b.errN||0)+1;
 if(b.errN>=8){try{finish(false);}catch(x){logErr('loop-finish',x);}return;}
 setTimeout(()=>{if(battle===b&&!b.done)loop();},400);}}
async function loop0(){const b=battle;if(!b||b.done)return;if(b.paused){setTimeout(loop,200);return;}
 if(huntStale(b))return;

 // 쿨다운·버프는 라운드가 아니라 '각 캐릭터 자신의 턴' 기준으로 act() 안에서 처리. 행동 순서 = 속도(속도 버프 반영) 높은 순
 b.order=[...alive(b.allies),...alive(b.foes)].sort((x,y)=>effSpd(y,b)-effSpd(x,b));

 while(b.order.length){if(b.done||battle!==b)return;if(b.paused){await sleep(200);continue;}
  const u=b.order[0];if(u.hp<=0){b.order.shift();paintOrder();continue;}
  try{await act(u);}catch(e){logErr('act',e);u.acted=true;b.errN=(b.errN||0)+1;if(b.errN>=8){if(battle===b&&!b.done)finish(!alive(b.foes).length);return;}}
  if(battle!==b)return;
  if(huntStale(b))return;
  b.order.shift();paintOrder();
  const t=performance.now();b.activeMs+=t-b.last;b.last=t;paintHud();
  if(!alive(b.foes).length){return finish(true);}if(!alive(b.allies).length){return finish(false);}
  await sleep(380);
 }
 await sleep(250);loop();
}
function pauseMenu(){const b=battle;b.paused=true;const p=el(`<div class="pause"><div class="box panel" style="padding:12px"><div class="sm" style="font-size:20px;text-align:center;margin-bottom:6px">일시정지</div><button class="btn primary cut-r" id="p-resume">계속</button><button class="btn ghost" id="p-motion">모션 ${state.motion?'끄기':'켜기'}</button><button class="btn ghost" id="p-sfx">효과음 ${SND.cfg().sfx?'끄기':'켜기'}</button><button class="btn ghost" id="p-bgm">배경음 ${SND.cfg().bgm?'끄기':'켜기'}</button><button class="btn ghost" id="p-lobby">로비로</button></div></div>`);$('#app').appendChild(p);p.addEventListener('click',e=>{if(e.target.closest('#p-resume')){b.paused=false;b.last=performance.now();p.remove();}if(e.target.closest('#p-motion')){state.motion=!state.motion;save();document.body.classList.toggle('motion-off',!state.motion);$('#p-motion',p).textContent=`모션 ${state.motion?'끄기':'켜기'}`;}if(e.target.closest('#p-sfx')){SND.set('sfx',!SND.cfg().sfx);$('#p-sfx',p).textContent=`효과음 ${SND.cfg().sfx?'끄기':'켜기'}`;SND.play('toggle');}if(e.target.closest('#p-bgm')){SND.set('bgm',!SND.cfg().bgm);$('#p-bgm',p).textContent=`배경음 ${SND.cfg().bgm?'끄기':'켜기'}`;}if(e.target.closest('#p-lobby')){b.done=true;battle=null;go('lobby');}});}
function finish(win){const b=battle;b.done=true;b.win=win;SND.play(win?'win':'lose');
 const st=b.stage;let gold=0,xp=0,first=false;
 /* v4.31 보상 처리 각 단계를 따로 try/catch: 한 곳이 예외를 던져도 반복 집계·다음 전투 예약·결과 표시는 반드시 실행 */
 const T=(n,f)=>{try{f();}catch(e){logErr('finish',new Error(n+': '+(e&&e.message||e)));}};
 if(win){first=!st.raid&&!state.cleared[st.no];let EB=1;T('skBonus',()=>{EB=1+skBonus().eco;});gold=Math.round(st.gold*(first?1.5:1)*EB);xp=Math.round(st.xp*EB);
  T('gold',()=>{state.gold+=gold;if(!st.raid)state.cleared[st.no]=true;});
  const ups=[];T('levelUp',()=>{for(const id of state.party){const lv=heroLv(id);const need=xpForLv(lv);const cur=(state.heroXp=state.heroXp||{})[id]||0;const nx=cur+xp;if(nx>=need){state.levels[id]=lv+1;state.heroXp[id]=nx-need;ups.push(id);}else state.heroXp[id]=nx;}});b.levelUps=ups;
  b.drops={got:[],full:0,stone:0,rune:0,tix:0,sold:0,sg:0,tmp:0,dis:0,lock:0};T('dropItems',()=>{b.drops=dropItems(st);});
  T('repeatEq',()=>{const d=b.drops,e=b.repeat.eq=b.repeat.eq||{n:0,lk:0,sd:0,sg:0,st:0,tm:0};e.fl=(e.fl||0)+d.full;e.n+=d.got.length;e.lk+=d.lock;e.sd+=d.sold;e.sg+=d.sg;e.st+=d.stone;e.tm+=d.tmp;});
  if(st.raid)T('raidProg',()=>{const n=st.rs||1;state.raidProg=state.raidProg||{};if(n>(state.raidProg[st.raid]|0))state.raidProg[st.raid]=n;}); // v4.40 첫 승리 → 다음 단계 해금
  T('plGain',()=>plGain(Math.ceil(xp/2)));T('save',()=>save());}
 if(st.raid)T('raidLog',()=>raidLogAdd(st,win,b.drops&&b.drops.lg));
 b.reward={gold,xp,first};
 const mode=st.raid?'stop':state.after; // 레이드는 자동 반복·다음 없음
 const toResult=()=>{try{clearResume();}catch(e){}setTimeout(()=>{try{showResult(b);}catch(e){logErr('showResult',e);}},900/rate());};
 try{
 if(mode!=='stop'){b.repeat.runs++;if(win){b.repeat.wins++;b.repeat.gold+=gold;b.repeat.xp+=xp;}T('paintRepeat',()=>paintRepeat());T('saveResume',()=>saveResume());
  if(win){const ni=b.stageIndex+1;let cd=900;T('banner',()=>{cd=stageBanner('clear',st,mode==='repeat'?`반복 ${b.repeat.runs}회 · 누적 GOLD +${fmt(b.repeat.gold)}`:ni<STAGES.length?`다음 ▸ ${STAGES[ni].no} ${STAGES[ni].name}`:'마지막 스테이지');});
   b.next=true;T('paintHunt',()=>paintHunt());
   setTimeout(()=>{if(battle!==b)return;try{const m=state.after;b.next=false;
    if(m==='repeat')startBattle(b.stageIndex,true);
    else if(m==='next'&&ni<STAGES.length)startBattle(ni,true);
    else{clearResume();showResult(b);}}catch(e){logErr('finish-next',e);b.next=false;if(battle===b)toResult();}},Math.max(900/rate(),cd+100));return;}}
 }catch(e){logErr('finish',e);}
 toResult();
}
/* v4.25 전투가 끝났을 때: 전투 화면에 있으면 결과 화면, 로비·가방에 있으면 화면은 그대로 두고 로비 상태 영역에 종료 사유만 표시(누르면 결과) */
function showResult(b){if(battle!==b)return;if(huntOn()){b.over=true;paintHunt();return;}page='result';render();}

/* ---------- 결과 ---------- */
function viewResult(){
 const b=battle,st=b.stage,win=b.win;if(win){setTimeout(()=>SND.play('reward'),250);if(b.levelUps&&b.levelUps.length)setTimeout(()=>SND.play('levelup'),700);}const secs=Math.max(1,b.activeMs/1000);const total=b.totalDmg;const maxHit=Math.max(0,...b.allies.map(h=>h.maxHit));
 const rows=[...b.allies].sort((x,y)=>y.dmg-x.dmg);const deaths=b.allies.filter(h=>h.hp<=0).length;const stars=win?(deaths===0?3:deaths<=2?2:1):0;
 const s=el(`<section class="screen result ${win?'victory':'defeat'}">
  <img class="bgimg" src="${chBg(st)}" alt="" style="filter:brightness(.35) saturate(.7) blur(1px)"><div class="veil"></div>
  <div class="title"><div class="diamonds"><i class="${stars>=1?'':'off'}"></i><i class="big ${stars>=2?'':'off'}"></i><i class="${stars>=3?'':'off'}"></i></div><span class="word">${win?'VICTORY':'DEFEAT'}</span><span class="kw">${win?'승리':'패배 · 아군 전원 쓰러짐'}</span><div class="rule"><i></i><b></b><i></i></div><div class="meta"><span class="no">${st.no}</span><span class="nm">${st.name}</span><span class="t">${Math.floor(secs/60)}:${String(Math.floor(secs%60)).padStart(2,'0')} · ROUND ${b.round}</span></div></div>
  <div class="totals panel cut-r"><div class="main"><span class="k">TOTAL DAMAGE</span><span class="v">${fmt(total)}</span></div><div class="sub"><span class="k">DPS</span><span class="v red">${fmt(total/secs)}</span></div><div class="sub"><span class="k">MAX HIT</span><span class="v sil">${fmt(maxHit)}</span></div></div>
  <div class="contrib panel"><div class="tabs"><button class="on" data-tab="dmg">대미지</button><button data-tab="heal">회복</button><button data-tab="taken">받은 피해</button></div><div class="rows" id="rows"></div></div>
  <div class="rewards panel"><div class="h"><span class="k">REWARDS</span><span class="f">${win?(b.reward.first?'FIRST CLEAR +50%':''):'NO REWARD'}</span></div><div class="tiles"><div class="tile cut-r"><span class="k">GOLD</span><span class="v">+${fmt(b.reward.gold)}</span></div><div class="tile cut-r"><span class="k">XP</span><span class="v">+${fmt(b.reward.xp)}</span></div><div class="tile cut-r"><span class="k">LEVEL UP</span><span class="v">${(b.levelUps||[]).length?b.levelUps.map(id=>HEROES.find(h=>h.id===id).name).join(' '):'—'}</span></div></div>${dropHtml(b)}</div>
  <div class="actions"><button class="btn cut-l" data-act="retry">다시 도전</button><button class="btn primary cut-r" data-act="next" ${win&&!st.raid&&b.stageIndex<STAGES.length-1?'':'disabled'}>다음 스테이지</button><button class="btn ghost sec" data-go="lobby">로비로 이동</button><button class="btn ghost sec" data-go="party">팀 편성</button></div>
 </section>`);
 const paintRows=(tab)=>{const key={dmg:'dmg',heal:'heal',taken:'taken'}[tab];const list=[...b.allies].sort((x,y)=>(y[key]||0)-(x[key]||0));const tot=list.reduce((n,h)=>n+(h[key]||0),0)||1;$('#rows',s).innerHTML=list.map((h,i)=>`<div class="row ${i===0&&(h[key]||0)>0?'top':''}"><div class="face" style="${faceStyle(h.id,28)}"></div><div><span class="nm">${h.name}</span><div class="bar"><i style="width:${(h[key]||0)/tot*100}%"></i></div></div><span class="v">${fmt(h[key]||0)}</span><span class="p">${Math.round((h[key]||0)/tot*100)}%</span></div>`).join('');};
 paintRows('dmg');
 s.addEventListener('click',e=>{const t=e.target.closest('[data-tab]');if(t){$$('[data-tab]',s).forEach(x=>x.classList.toggle('on',x===t));paintRows(t.dataset.tab);return;}const a=e.target.closest('[data-act]');if(a&&!a.disabled){if(a.dataset.act==='retry'){if(st.raid)startRaid(st.raid,st.rs||1);else startBattle(b.stageIndex);}else startBattle(b.stageIndex+1);return;}const g=e.target.closest('[data-go]');if(g){battle=null;go(g.dataset.go);}});
 return s;
}

/* ---------- 시작 ---------- */
document.addEventListener('click',e=>{const b=e.target.closest('button');if(b&&!b.disabled)SND.play('click');},true);
load();fit();if(!tryResume())render();cloudInit().then(loginGate);
</script>
